name: Secret scan

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Block tracked env and signing credential files
        shell: bash
        run: |
          set -euo pipefail
          blocked="$(
            git ls-files | awk '
              {
                path = tolower($0)
                if (path ~ /(^|\/)\.env($|\.)/ && path !~ /\.example$/) { print; next }
                if (path ~ /(^|\/)keystore\.properties$/) { print; next }
                if (path ~ /\.(jks|keystore)$/) { print }
              }
            '
          )"
          if [ -n "$blocked" ]; then
            echo "Real env and signing credential files must not be tracked."
            echo "Commit only .env*.example and public signing metadata."
            echo "$blocked"
            exit 1
          fi

      - name: Gitleaks working tree scan
        shell: bash
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            dir --config /repo/.gitleaks.toml --redact --verbose --no-banner .

      - name: Gitleaks new commit history (blocking)
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD: ${{ github.event.pull_request.head.sha || '' }}
          PUSH_BEFORE: ${{ github.event.before || '' }}
          PUSH_HEAD: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            scan_range="${PR_BASE}..${PR_HEAD}"
          elif [ -n "$PUSH_BEFORE" ] && ! printf '%s' "$PUSH_BEFORE" | grep -Eq '^0+$'; then
            scan_range="${PUSH_BEFORE}..${PUSH_HEAD}"
          else
            base="$(git merge-base HEAD "origin/${DEFAULT_BRANCH}" 2>/dev/null || git rev-parse HEAD^)"
            scan_range="${base}..HEAD"
          fi
          echo "Scanning new commit history: ${scan_range}"
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --config /repo/.gitleaks.toml --redact --verbose --no-banner --log-opts="${scan_range}" .

      # The repository contains acknowledged legacy findings. Keep scanning all
      # history and publish a redacted report while new commits are blocked above.
      # This step can become blocking after the legacy history is rewritten or a
      # reviewed redacted baseline is committed.
      - name: Gitleaks full history (legacy report)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        id: full_history
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --config /repo/.gitleaks.toml --redact --verbose --no-banner \
            --report-format json --report-path /repo/gitleaks-history-report.json .

      - name: Upload redacted history report
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gitleaks-history-report
          path: gitleaks-history-report.json
          if-no-files-found: ignore
          retention-days: 14
