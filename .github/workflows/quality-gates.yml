name: Quality gates

on:
  workflow_dispatch:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-contracts:
    name: Repository contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject newly tracked generated artifacts
        shell: pwsh
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: ./infrastructure/scripts/security/check-repository-hygiene.ps1 -BaseRevision $env:BASE_REVISION
      - name: Reject oversized Git blobs
        if: github.event_name != 'push' || github.event.deleted != true
        shell: pwsh
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          $baseRevision = $env:BASE_REVISION
          if ([string]::IsNullOrWhiteSpace($baseRevision) -or $baseRevision -match '^0+$') {
            $baseRevision = "origin/$env:DEFAULT_BRANCH"
          }
          ./infrastructure/scripts/security/check-large-git-files.ps1 -Mode range -BaseRevision $baseRevision -TargetRevision HEAD
      - name: Enforce append-only Flyway migrations
        shell: pwsh
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: ./infrastructure/scripts/security/check-flyway-contract.ps1 -BaseRevision $env:BASE_REVISION
      - name: Validate Compose models
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          trap 'rm -f .env' EXIT
          for compose_file in docker-compose.yaml compose.prod-local.yaml docker-compose.build.yaml; do
            echo "Validating ${compose_file}"
            docker compose --env-file .env.example -f "${compose_file}" config --quiet
          done

  backend:
    name: Backend (full Testcontainers suite)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "26"
          cache: maven
      - name: Run all tests and package
        working-directory: backend
        run: bash ./mvnw -B -ntp verify
      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend (unit and production build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test -- --watch=false
      - run: npm run build -- --configuration production

  mobile:
    name: Mobile web (unit and production build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run test:unit
      - run: npm run build:prod

  whatsapp:
    name: WhatsApp gateway (unit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: whatsapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: whatsapp/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test

  external-review-worker:
    name: External review worker (syntax and health)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/external-review-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: backend/external-review-worker/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check JavaScript syntax
        shell: bash
        run: find src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run worker security and behavior tests
        run: npm test
      - name: Smoke-test health endpoint
        shell: bash
        run: |
          set -euo pipefail
          log_file="${RUNNER_TEMP}/external-review-worker.log"
          PORT=3097 node src/index.js >"${log_file}" 2>&1 &
          worker_pid=$!
          cleanup() {
            kill "${worker_pid}" 2>/dev/null || true
            wait "${worker_pid}" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3097/health | grep --quiet '"ok":true'; then
              exit 0
            fi
            if ! kill -0 "${worker_pid}" 2>/dev/null; then
              cat "${log_file}"
              exit 1
            fi
            sleep 1
          done

          cat "${log_file}"
          echo "External review worker did not become healthy in 30 seconds" >&2
          exit 1
