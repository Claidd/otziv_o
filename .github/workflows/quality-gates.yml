name: Quality gates

on:
  workflow_dispatch:
    inputs:
      publish-reviewed-images:
        description: Publish reviewed infrastructure candidates to GHCR and scan their exact digests; does not deploy
        type: boolean
        required: false
        default: false
      reviewed-image-set:
        description: Reviewed publication set; named sets publish one component and never deploy it
        type: choice
        required: false
        default: baseline
        options:
          - baseline
          - c12-phpmyadmin
          - c14-mc
          - c14-local-s3
          - c14-postgres
          - c14-keycloak
          - c15-prometheus
          - c15-loki
          - c15-alloy
          - c15-tempo
          - c15-grafana
          - c15-keycloak
          - c15-mc
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.event.pull_request.number || github.ref }}-${{ inputs.publish-reviewed-images && 'publication' || 'verification' }}-${{ inputs.publish-reviewed-images && inputs.reviewed-image-set || 'baseline' }}
  cancel-in-progress: true

jobs:
  reviewed-image-inventory:
    name: Inventory reviewed publication candidates
    env:
      OTZIV_REVIEWED_IMAGE_SET: ${{ inputs.reviewed-image-set || 'baseline' }}
    if: github.event_name == 'workflow_dispatch' && inputs.publish-reviewed-images == true
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.inventory.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
          package-manager-cache: false
      - id: inventory
        run: node infrastructure/runtime-security/publish-reviewed-images.mjs matrix

  reviewed-image-publication:
    name: Publish reviewed candidate (${{ matrix.component }})
    env:
      OTZIV_REVIEWED_IMAGE_SET: ${{ inputs.reviewed-image-set || 'baseline' }}
    needs: reviewed-image-inventory
    if: github.event_name == 'workflow_dispatch' && inputs.publish-reviewed-images == true
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.reviewed-image-inventory.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
          package-manager-cache: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          show-download-progress: true
          cache: maven
          cache-jdk: false
      - name: Authenticate only to the repository container registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish provenance, SBOM and candidate; scan its actual registry digest
        env:
          COMPONENT: ${{ matrix.component }}
          OTZIV_PUBLISH_REVIEWED_IMAGES: 'true'
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node infrastructure/runtime-security/publish-reviewed-images.mjs "$COMPONENT" "$RUNNER_TEMP/reviewed-publication"
      - name: Preserve exact publication and security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reviewed-publication-${{ matrix.component }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reviewed-publication/
          if-no-files-found: warn
          retention-days: 14
      - name: End the registry session
        if: always()
        run: docker logout ghcr.io

  reviewed-image-anonymous-download:
    name: Prove anonymous candidate download (${{ matrix.component }})
    env:
      OTZIV_REVIEWED_IMAGE_SET: ${{ inputs.reviewed-image-set || 'baseline' }}
    needs: [reviewed-image-inventory, reviewed-image-publication]
    # Retain independent component proofs when another publication fails. Each
    # verifier still rejects a missing or failed same-run publication artifact.
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.publish-reviewed-images == true && needs.reviewed-image-inventory.result == 'success' && (needs.reviewed-image-publication.result == 'success' || needs.reviewed-image-publication.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.reviewed-image-inventory.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
          package-manager-cache: false
      - name: Download this component's publication from this workflow run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reviewed-publication-${{ matrix.component }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reviewed-publication-input
      - name: Verify fresh anonymous registry evidence and digest pull
        env:
          COMPONENT: ${{ matrix.component }}
          OTZIV_VERIFY_ANONYMOUS_DOWNLOAD: 'true'
        run: node infrastructure/runtime-security/verify-anonymous-download.mjs "$COMPONENT" "$RUNNER_TEMP/reviewed-publication-input" "$RUNNER_TEMP/anonymous-download"
      - name: Preserve separate anonymous download proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: anonymous-download-${{ matrix.component }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/anonymous-download/
          if-no-files-found: warn
          retention-days: 14

  repository-contracts:
    if: github.event_name != 'workflow_dispatch' || inputs.publish-reviewed-images != true
    name: Repository contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Validate workflow syntax and expressions
        run: >-
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true
          --mount "type=bind,source=$GITHUB_WORKSPACE/.github/workflows,target=/fixture,readonly"
          rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color /fixture/quality-gates.yml /fixture/dependency-audit.yml
      - name: Reject newly tracked generated artifacts
        shell: pwsh
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          . ./infrastructure/scripts/security/resolve-ci-base-revision.ps1
          $baseRevision = Resolve-CiBaseRevision -BaseRevision $env:BASE_REVISION -DefaultBranch $env:DEFAULT_BRANCH
          ./infrastructure/scripts/security/check-repository-hygiene.ps1 -BaseRevision $baseRevision
      - name: Enforce infrastructure security contracts
        shell: pwsh
        run: ./infrastructure/scripts/security/check-infrastructure-contract.ps1
      - name: Exercise production release lineage guards
        shell: pwsh
        run: ./infrastructure/scripts/security/check-deploy-release-contract.ps1
      - name: Exercise database image continuity and startup guards
        run: python3 -m unittest discover -s infrastructure/scripts/prod -p "test_*.py" -v
      - name: Reject unsafe local restore targets before any Docker mutation
        shell: pwsh
        run: ./infrastructure/scripts/local/test-restore-contract.ps1
      - name: Verify build-support audit policy guards
        run: python3 -m unittest discover -s backend/build-support -p "test_*.py" -v
      - name: Verify conditional dependency aggregate contract
        run: node --test infrastructure/scripts/security/dependency-changes.test.mjs infrastructure/scripts/security/verify-branch-policy.test.mjs
      - name: Verify every original finding and prevent premature closure
        run: |
          node --test infrastructure/scripts/security/verify-remediation-registry.test.mjs
          node infrastructure/scripts/security/verify-remediation-registry.mjs
      - name: Verify scenario comparison invariants
        run: node --test infrastructure/scripts/performance/compare-scenarios.test.mjs
      - name: Validate opt-in monitoring overlay and required source configuration
        run: node infrastructure/monitoring/validate-compose.mjs
      - name: Verify Docker observer boundary
        run: node --test infrastructure/docker-observer/*.test.js
      - name: Verify generated API contracts
        run: node contracts/generate.mjs --check
      - name: Test recovery, monitoring and runtime security gates
        run: node --test infrastructure/recovery/*.test.mjs infrastructure/monitoring/*.test.mjs infrastructure/runtime-security/*.test.mjs
      - name: Test bounded report upload and strict completion checks
        run: node --test .github/actions/upload-report/*.test.mjs
      - name: Reproduce Linux scanner bind permissions with the pinned scanner
        run: node infrastructure/runtime-security/scanner-bind-smoke.mjs "$RUNNER_TEMP/scanner-bind-proof.json"
      - name: Test notification media production importer
        shell: bash
        run: python3 -m unittest infrastructure/scripts/security/test_notification_media_import.py -v
      - name: Validate safe backup defaults
        shell: pwsh
        run: ./infrastructure/scripts/security/check-backup-readiness.ps1 -EnvFile .env.prod.example
      - name: Test production backup readiness guards
        shell: pwsh
        run: ./infrastructure/scripts/security/test-backup-readiness.ps1
      - name: Test protected production backup importer
        shell: pwsh
        run: ./infrastructure/scripts/security/test-import-prod-backup-config.ps1
      - name: Test external project-file path resolution
        shell: pwsh
        run: ./infrastructure/scripts/security/test-resolve-otziv-env-file.ps1
      - name: Reject false registry failure fallback during local builds
        shell: pwsh
        run: ./infrastructure/scripts/security/test-local-build-fallback.ps1
      - name: Test SQL guard against staged-source and malicious-worktree cases
        shell: pwsh
        run: ./infrastructure/scripts/security/test-sql-injection-guard.ps1
      - name: Test new-branch and pull-request Git range enforcement
        shell: pwsh
        run: ./infrastructure/scripts/security/test-ci-base-revision.ps1
      - name: Test exact public SBOM blob limits and reject substitutions
        shell: pwsh
        run: ./infrastructure/scripts/security/test-large-git-files.ps1
      - name: Reject oversized Git blobs
        if: github.event_name != 'push' || github.event.deleted != true
        shell: pwsh
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          . ./infrastructure/scripts/security/resolve-ci-base-revision.ps1
          $baseRevision = Resolve-CiBaseRevision -BaseRevision $env:BASE_REVISION -DefaultBranch $env:DEFAULT_BRANCH
          ./infrastructure/scripts/security/check-large-git-files.ps1 -Mode range -BaseRevision $baseRevision -TargetRevision HEAD
      - name: Enforce append-only Flyway migrations
        shell: pwsh
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          . ./infrastructure/scripts/security/resolve-ci-base-revision.ps1
          $baseRevision = Resolve-CiBaseRevision -BaseRevision $env:BASE_REVISION -DefaultBranch $env:DEFAULT_BRANCH
          ./infrastructure/scripts/security/check-flyway-contract.ps1 -BaseRevision $baseRevision
      - name: Validate Compose models
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          trap 'rm -f .env' EXIT
          for compose_file in compose.yaml docker-compose.yaml compose.prod-local.yaml docker-compose.build.yaml; do
            echo "Validating ${compose_file}"
            docker compose --env-file .env.example -f "${compose_file}" config --quiet
          done

  backend:
    if: github.event_name != 'workflow_dispatch' || inputs.publish-reviewed-images != true
    name: Backend (full Testcontainers suite)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "26"
          show-download-progress: true
          cache: maven
          cache-jdk: false
      - name: Build reviewed Maven tooling and test transport
        working-directory: backend
        run: bash ./mvnw -B -ntp -f build-support/pom.xml install
      - name: Run all tests and package
        working-directory: backend
        run: bash ./mvnw -B -ntp verify
      - name: Enforce financial SQL budgets and capture CTE optimizer plans
        working-directory: backend
        run: bash ./mvnw -B -ntp -Dtest=FinancialCtePlanEvidence -Dotziv.benchmark.cte.iterations=4 -Dotziv.benchmark.source=ci -Dotziv.benchmark.query-budgets=true test
      - name: Preserve causal performance scenario measurements
        if: always()
        uses: ./.github/actions/upload-report
        with:
          name: financial-scenario-benchmark
          path: backend/target/performance/*.json
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Scan packaged Maven runtime libraries
        run: node infrastructure/runtime-security/scan.mjs java backend/target "$RUNNER_TEMP/maven-vulnerabilities.json"
      - name: Preserve Maven security evidence
        if: always()
        uses: ./.github/actions/upload-report
        with:
          name: maven-runtime-security
          path: ${{ runner.temp }}/maven-vulnerabilities*
          if-no-files-found: warn
          retention-days: 14
      - name: Upload backend test reports
        if: always()
        uses: ./.github/actions/upload-report
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  issuer-security:
    if: github.event_name != 'workflow_dispatch' || inputs.publish-reviewed-images != true
    name: Issuer security generation (real Keycloak and PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          show-download-progress: true
          cache: maven
          cache-jdk: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Build the pinned Keycloak provider and test transaction failure behavior
        working-directory: backend
        run: bash ./mvnw -f ../infrastructure/keycloak/security-generation/pom.xml -B -ntp verify
      - name: Build the real issuer release image
        run: docker build -t otziv-issuer-ci infrastructure/keycloak/security-generation/c15-netty
      - name: Build and scan reviewed database candidates
        run: |
          docker build -t otziv-mysql-ci infrastructure/mysql
          docker build -t otziv-postgres-ci infrastructure/runtime-security/builds/postgres-c14
          node infrastructure/runtime-security/scan.mjs image otziv-mysql-ci "$RUNNER_TEMP/mysql-vulnerabilities.json"
          node infrastructure/runtime-security/scan.mjs image otziv-postgres-ci "$RUNNER_TEMP/postgres-vulnerabilities.json"
      - name: Verify PostgreSQL minor upgrade and separate backup rollback
        run: |
          docker pull postgres@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
          node infrastructure/postgres/upgrade-proof.mjs otziv-postgres-ci "$RUNNER_TEMP/postgres-upgrade"
          node infrastructure/runtime-security/proofs/c14-postgres/continuity.mjs otziv-postgres-ci "$RUNNER_TEMP/postgres-continuity"
          node infrastructure/runtime-security/proofs/c14-postgres/tcp-contract.mjs otziv-postgres-ci "$RUNNER_TEMP/postgres-tcp"
      - name: Reject provisioning configuration drift and inherited claim conflicts
        run: node --test infrastructure/keycloak/security-generation/provision.test.mjs
      - name: Exercise provisioning, browser PKCE, immutable refresh, external mutations and rollback on journal failure
        env:
          OTZIV_ISSUER_PROOF_POSTGRES_IMAGE: otziv-postgres-ci
          OTZIV_ISSUER_PROOF_NODE_IMAGE: node:22-bookworm-slim@sha256:83f487e0a63425e5b4d146fb5e5be574bcbe1b7b843d3ebafdd95eaf7767a7e5
        run: node infrastructure/keycloak/security-generation/container-proof.mjs otziv-issuer-ci "$RUNNER_TEMP/issuer-proof.json"
      - name: Verify ordinary production import and development startup modes
        env:
          OTZIV_ISSUER_PROOF_POSTGRES_IMAGE: otziv-postgres-ci
          OTZIV_ISSUER_PROOF_NODE_IMAGE: node:22-bookworm-slim@sha256:83f487e0a63425e5b4d146fb5e5be574bcbe1b7b843d3ebafdd95eaf7767a7e5
        run: node infrastructure/keycloak/security-generation/image-startup-smoke.mjs otziv-issuer-ci "$RUNNER_TEMP/issuer-startup-proof.json"
      - name: Scan the actual issuer image
        run: node infrastructure/runtime-security/scan.mjs image otziv-issuer-ci "$RUNNER_TEMP/issuer-vulnerabilities.json"
      - name: Build the application for paired recovery
        run: docker build -t otziv-recovery-app-ci -f backend/Dockerfile backend
      - name: Load the pinned database and object-store fixtures
        run: |
          docker pull mysql@sha256:8b879a3959bc59adcb7281a41950d39cf8c9b3fb23b87b9b62318ce884a7c383
          docker pull postgres@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
          docker pull quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
      - name: Restore both databases, exact object versions and keys after destroying the source fixture
        env:
          OTZIV_SYSTEM_FIXTURE_MYSQL_IMAGE: otziv-mysql-ci
          OTZIV_SYSTEM_FIXTURE_POSTGRES_IMAGE: otziv-postgres-ci
          OTZIV_SYSTEM_FIXTURE_NODE_IMAGE: node:22-bookworm-slim@sha256:83f487e0a63425e5b4d146fb5e5be574bcbe1b7b843d3ebafdd95eaf7767a7e5
        run: node infrastructure/recovery/full-system-fixture.mjs otziv-recovery-app-ci otziv-issuer-ci "$RUNNER_TEMP/paired-recovery"
      - name: Preserve issuer protocol and vulnerability evidence
        if: always()
        uses: ./.github/actions/upload-report
        with:
          name: issuer-security-generation
          path: |
            infrastructure/keycloak/security-generation/target/surefire-reports/
            ${{ runner.temp }}/issuer-proof*
            ${{ runner.temp }}/issuer-startup-proof.json
            ${{ runner.temp }}/issuer-vulnerabilities*
            ${{ runner.temp }}/paired-recovery/proof.json
            ${{ runner.temp }}/postgres-upgrade/proof.json
            ${{ runner.temp }}/postgres-continuity/**
            ${{ runner.temp }}/postgres-tcp/**
            ${{ runner.temp }}/mysql-vulnerabilities*
            ${{ runner.temp }}/postgres-vulnerabilities*
          if-no-files-found: warn
          retention-days: 14

  frontend:
    if: github.event_name != 'workflow_dispatch' || inputs.publish-reviewed-images != true
    name: Frontend (unit and production build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Audit the complete installed dependency graph
        run: npm audit --audit-level=high
      - run: npm test -- --watch=false
      - run: npm run build -- --configuration production

  mobile:
    if: github.event_name != 'workflow_dispatch' || inputs.publish-reviewed-images != true
    name: Mobile web (unit and production build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Audit the complete installed dependency graph
        run: npm audit --audit-level=high
      - run: npm run test:unit
      - run: npm run test:runtime
      - run: npm run build:prod

  browser-smoke:
    if: github.event_name != 'workflow_dispatch' || inputs.publish-reviewed-images != true
    name: Built web and mobile browser scenarios
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            mobile/package-lock.json
            infrastructure/browser-smoke/package-lock.json
      - name: Build the real production web application
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build -- --configuration production
      - name: Build the real production mobile web application
        working-directory: mobile
        run: |
          npm ci --no-audit --no-fund
          npm run build:prod
      - name: Install pinned browser runner
        working-directory: infrastructure/browser-smoke
        run: |
          npm ci --no-fund
          npm audit --audit-level=high
          npx playwright install --with-deps chromium
      - name: Exercise browser UI using loopback fixtures only
        working-directory: infrastructure/browser-smoke
        shell: bash
        run: |
          set -euo pipefail
          node --test hosted-sandbox.test.mjs
          cleanup() {
            result=$?
            trap - EXIT
            if ! node hosted-sandbox.mjs cleanup; then result=1; fi
            exit "$result"
          }
          trap cleanup EXIT
          node hosted-sandbox.mjs prepare
          npm test
      - name: Preserve browser reports, failure screenshots and traces
        if: always()
        uses: ./.github/actions/upload-report
        with:
          name: browser-smoke-reports
          path: |
            infrastructure/browser-smoke/playwright-report/
            infrastructure/browser-smoke/test-results/
            ${{ runner.temp }}/otziv-hosted-sandbox-proof.json
          if-no-files-found: warn
          retention-days: 14

  android-compile:
    if: github.event_name != 'workflow_dispatch' || inputs.publish-reviewed-images != true
    name: Android native tests, lint and debug assembly
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          show-download-progress: true
          cache: gradle
          cache-jdk: false
      - name: Install required hosted Android SDK packages
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          sdk_manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdk_manager"
          "$sdk_manager" --sdk_root="$sdk_root" "platforms;android-36" "build-tools;35.0.0"
      - name: Build and sync mobile assets without push or release signing
        working-directory: mobile
        run: |
          npm ci --no-audit --no-fund
          node --check scripts/native-auth-storage-smoke.mjs
          npm run build:local
          npx --no-install cap sync android
      - name: Compile native plugins and enforce Android lint
        working-directory: mobile/android
        run: bash ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Preserve Android unit and lint reports
        if: always()
        uses: ./.github/actions/upload-report
        with:
          name: android-native-lint
          path: |
            mobile/android/**/build/reports/lint-results-debug.*
            mobile/android/app/build/test-results/testDebugUnitTest/
            mobile/android/app/build/reports/tests/testDebugUnitTest/
            mobile/node_modules/@capacitor/**/android/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 14

  whatsapp:
    if: github.event_name != 'workflow_dispatch' || inputs.publish-reviewed-images != true
    name: WhatsApp gateway (unit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: whatsapp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: whatsapp/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit the complete installed dependency graph
        run: npm audit --audit-level=high
      - run: npm test

  external-review-worker:
    if: github.event_name != 'workflow_dispatch' || inputs.publish-reviewed-images != true
    name: External review worker (syntax and health)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/external-review-worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: backend/external-review-worker/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit the complete installed dependency graph
        run: npm audit --audit-level=high
      - name: Check JavaScript syntax
        shell: bash
        run: find src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run worker security and behavior tests
        run: npm test
      # Readiness is checked in the actual image below; liveness alone is insufficient.

  client-parity:
    if: github.event_name != 'workflow_dispatch' || inputs.publish-reviewed-images != true
    name: Shared client package and compatibility fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm ci --no-audit --no-fund
        working-directory: mobile
      - run: node contracts/generate.mjs --check
      - run: node --test contracts/client-common.test.mjs
      - name: Verify published Android/backend compatibility fixtures
        run: node contracts/verify-release-compatibility.mjs

  upstream-inventory:
    if: github.event_name != 'workflow_dispatch' || inputs.publish-reviewed-images != true
    name: Inventory pinned upstream images
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.inventory.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - id: inventory
        run: node infrastructure/runtime-security/upstream-images.mjs matrix

  upstream-images:
    if: github.event_name != 'workflow_dispatch' || inputs.publish-reviewed-images != true
    name: Pinned upstream image (${{ matrix.id }})
    needs: upstream-inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.upstream-inventory.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Pull and scan the exact Compose default without starting it
        env:
          UPSTREAM_IMAGE: ${{ matrix.image }}
          UPSTREAM_ID: ${{ matrix.id }}
        run: |
          docker pull "$UPSTREAM_IMAGE"
          node infrastructure/runtime-security/scan.mjs image "$UPSTREAM_IMAGE" "$RUNNER_TEMP/$UPSTREAM_ID-vulnerabilities.json"
      - name: Preserve raw findings, package inventory and triage
        if: always()
        uses: ./.github/actions/upload-report
        with:
          name: upstream-security-${{ matrix.id }}
          path: ${{ runner.temp }}/*-vulnerabilities*
          if-no-files-found: warn
          retention-days: 14

  upstream-image-gate:
    name: Upstream image security gate
    if: always() && (github.event_name != 'workflow_dispatch' || inputs.publish-reviewed-images != true)
    needs: [upstream-inventory, upstream-images, monitoring-candidates]
    runs-on: ubuntu-24.04
    steps:
      - name: Reject missing, failed, cancelled or skipped upstream scans
        env:
          INVENTORY_RESULT: ${{ needs.upstream-inventory.result }}
          SCAN_RESULT: ${{ needs.upstream-images.result }}
          CANDIDATE_RESULT: ${{ needs.monitoring-candidates.result }}
        run: test "$INVENTORY_RESULT" = success && test "$SCAN_RESULT" = success && test "$CANDIDATE_RESULT" = success

  integration-images:
    if: github.event_name != 'workflow_dispatch' || inputs.publish-reviewed-images != true
    name: Built integration image (${{ matrix.component }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        component: [worker, whatsapp, observer, backend, web, publisher]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Build the actual release Dockerfile
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          set -euo pipefail
          case "$COMPONENT" in
            worker) docker build -t otziv-worker-ci -f backend/external-review-worker/Dockerfile backend/external-review-worker ;;
            whatsapp) docker build -t otziv-whatsapp-ci -f Dockerfile.whatsapp . ;;
            observer) docker build -t otziv-observer-ci infrastructure/docker-observer ;;
            backend) docker build -t otziv-backend-ci -f backend/Dockerfile backend ;;
            web) docker build -t otziv-web-ci -f frontend/Dockerfile . ;;
            publisher) docker build -t otziv-publisher-ci infrastructure/monitoring ;;
          esac
      - name: Exercise sandbox, actual readiness and cleanup under release hardening
        if: matrix.component == 'worker' || matrix.component == 'whatsapp'
        env:
          COMPONENT: ${{ matrix.component }}
        run: node infrastructure/runtime-security/container-smoke.mjs "$COMPONENT" "otziv-$COMPONENT-ci"
      - name: Exercise real pinned Dozzle and Alloy against the observer
        if: matrix.component == 'observer'
        run: node infrastructure/docker-observer/consumer-smoke.mjs otziv-observer-ci
      - name: Exercise actual ordered observer deployment and failure stops
        if: matrix.component == 'observer'
        run: node infrastructure/docker-observer/deployment-contract.mjs otziv-observer-ci
      - name: Exercise actual collector and authenticated HTTPS in the built publisher
        if: matrix.component == 'publisher'
        run: node infrastructure/monitoring/container-smoke.mjs otziv-publisher-ci
      - name: Check backend runtime, non-root user and shipped trust stores without external services
        if: matrix.component == 'backend'
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,nosuid,size=64m --memory 512m --pids-limit 128 \
            --entrypoint sh otziv-backend-ci -ec '
              test "$(id -u)" -ne 0
              test -s /app/app.jar
              java -XshowSettings:properties -version 2>&1 | grep "java.specification.version = 26"
              mysql --version
              test -s /etc/ssl/certs/ca-certificates.crt
              for alias in russian-trusted-root-ca russian-trusted-sub-ca russian-trusted-sub-ca-2024; do
                keytool -list -alias "$alias" -keystore "$JAVA_HOME/lib/security/cacerts" -storepass changeit >/dev/null
              done
            '
      - name: Check web runtime and shipped artifacts without external services
        if: matrix.component == 'web'
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --memory 128m --pids-limit 64 --entrypoint sh otziv-web-ci -ec '
              nginx -v
              test -s /usr/share/nginx/html/index.html
              test -s /etc/nginx/templates/default.conf.template
            '
      - name: Scan OS and application libraries in the built image
        if: always()
        env:
          COMPONENT: ${{ matrix.component }}
        run: node infrastructure/runtime-security/scan.mjs image "otziv-$COMPONENT-ci" "$RUNNER_TEMP/$COMPONENT-vulnerabilities.json"
      - name: Preserve vulnerability evidence
        if: always()
        uses: ./.github/actions/upload-report
        with:
          name: integration-image-security-${{ matrix.component }}
          path: ${{ runner.temp }}/*-vulnerabilities*
          if-no-files-found: warn
          retention-days: 14

  monitoring-candidates:
    if: github.event_name != 'workflow_dispatch' || inputs.publish-reviewed-images != true
    name: Monitoring candidate (${{ matrix.component }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - component: prometheus
            dockerfile: Prometheus
          - component: loki
            dockerfile: Loki
          - component: alloy
            dockerfile: Alloy
          - component: tempo
            dockerfile: Tempo
          - component: grafana
            dockerfile: Grafana
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Validate mandatory immutable release references and overlay contracts
        run: node --test infrastructure/runtime-security/monitoring-release.test.mjs
      - name: Build the exact source derivative and isolated proof runner
        env:
          COMPONENT: ${{ matrix.component }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/monitoring-evidence"
          docker build -f "infrastructure/runtime-security/builds/$DOCKERFILE.Dockerfile" -t "otziv-monitoring-$COMPONENT-ci" infrastructure/runtime-security 2>&1 | tee "$RUNNER_TEMP/monitoring-evidence/build.log"
          docker build -t otziv-monitoring-proof-ci infrastructure/docker-observer
      - name: Pull the actual source pin and prove persistence, restart and backup rollback
        env:
          COMPONENT: ${{ matrix.component }}
          OTZIV_MONITORING_PROOF_NODE_IMAGE: otziv-monitoring-proof-ci
        run: |
          set -euo pipefail
          SOURCE_IMAGE=$(node infrastructure/runtime-security/monitoring-source.mjs "$COMPONENT")
          docker pull "$SOURCE_IMAGE"
          CANDIDATE_ID=$(docker image inspect --format '{{.Id}}' "otziv-monitoring-$COMPONENT-ci")
          node infrastructure/runtime-security/monitoring-upgrade.mjs "$COMPONENT" "$CANDIDATE_ID" "$RUNNER_TEMP/monitoring-evidence/storage" 2>&1 | tee "$RUNNER_TEMP/monitoring-evidence/storage.log"
      - name: Prove Alloy forwards actual Docker and all four configured file streams
        if: matrix.component == 'alloy'
        run: |
          set -euo pipefail
          OTZIV_CONSUMER_PROOF_ALLOY_IMAGE=$(docker image inspect --format '{{.Id}}' otziv-monitoring-alloy-ci)
          export OTZIV_CONSUMER_PROOF_ALLOY_IMAGE
          node infrastructure/docker-observer/consumer-smoke.mjs otziv-monitoring-proof-ci 2>&1 | tee "$RUNNER_TEMP/monitoring-evidence/consumers.log"
      - name: Scan every package in the built candidate without suppressions
        env:
          COMPONENT: ${{ matrix.component }}
        run: node infrastructure/runtime-security/scan.mjs image "otziv-monitoring-$COMPONENT-ci" "$RUNNER_TEMP/monitoring-evidence/vulnerabilities.json"
      - name: Preserve exact builds, configuration, raw scans, SBOM and rollback proof
        if: always()
        uses: ./.github/actions/upload-report
        with:
          name: monitoring-candidate-${{ matrix.component }}
          path: ${{ runner.temp }}/monitoring-evidence/
          if-no-files-found: warn
          retention-days: 14
