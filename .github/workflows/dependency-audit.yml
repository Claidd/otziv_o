name: Dependency audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Dependency change detection
    runs-on: ubuntu-24.04
    outputs:
      audit: ${{ steps.detect.outputs.audit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - id: detect
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: node infrastructure/scripts/security/dependency-changes.mjs
  npm-audit:
    needs: changes
    if: needs.changes.outputs.audit == 'true'
    name: npm audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project:
          - frontend
          - mobile
          - whatsapp
          - backend/external-review-worker
          - infrastructure/browser-smoke
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ (matrix.project == 'whatsapp' || matrix.project == 'backend/external-review-worker') && '22.23.2' || '24.18.0' }}
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - name: Verify locked install
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: ${{ matrix.project }}
      - name: Full dependency audit (blocking)
        run: npm audit --audit-level=low
        working-directory: ${{ matrix.project }}
      - name: Production dependency audit (blocking)
        run: npm audit --omit=dev --audit-level=moderate
        working-directory: ${{ matrix.project }}

  maven-audit:
    needs: changes
    if: needs.changes.outputs.audit == 'true'
    name: Maven dependency-check
    runs-on: ubuntu-24.04
    # An uncached complete NVD import is rate limited without an API key.
    # Bound two OWASP mirror refresh attempts and leave time for every scan
    # and an early public-database cache save, including after refresh failure.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"
          show-download-progress: true
          cache: maven
          cache-jdk: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - name: Prepare isolated public analyzer cache
        run: |
          mkdir -p "$RUNNER_TEMP/otziv-dependency-check-data" "$GITHUB_WORKSPACE/backend/target"
          test ! -e "$GITHUB_WORKSPACE/backend/target/dependency-check-data"
          test ! -L "$GITHUB_WORKSPACE/backend/target/dependency-check-data"
          ln -s "$RUNNER_TEMP/otziv-dependency-check-data" "$GITHUB_WORKSPACE/backend/target/dependency-check-data"
      # Cache only the public NVD database.
      # Maven settings, PAT, reports, logs and the rest of target are excluded.
      - name: Restore public NVD data
        id: nvd-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/otziv-dependency-check-data/odc.mv.db
          key: ${{ runner.os }}-dependency-check-13-public-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ runner.os }}-dependency-check-13-public-v2-
      # The upstream OWASP mirror is best-effort, so refuse a stale snapshot.
      # https://dependency-check.github.io/DependencyCheck/data/mirrornvd.html
      - name: Check public NVD mirror freshness
        run: |
          curl --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 20 --max-time 120 \
            -o "$RUNNER_TEMP/nvdcve-modified.meta" \
            'https://dependency-check.github.io/DependencyCheck_Builder/nvd_cache/nvdcve-modified.meta'
          python3 - "$RUNNER_TEMP/nvdcve-modified.meta" <<'PY'
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          import sys

          lines = Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
          stamps = [line.partition(":")[2].strip() for line in lines if line.startswith("lastModifiedDate:")]
          if len(stamps) != 1:
              raise SystemExit("NVD mirror metadata lacks a unique lastModifiedDate")
          stamp = datetime.fromisoformat(stamps[0].replace("Z", "+00:00"))
          if stamp.tzinfo is None:
              raise SystemExit("NVD mirror timestamp lacks a timezone")
          age = datetime.now(timezone.utc) - stamp
          print(f"NVD mirror snapshot age: {age}")
          if not -timedelta(minutes=5) <= age <= timedelta(hours=72):
              raise SystemExit("NVD mirror snapshot is stale or dated in the future")
          PY
      - name: Build reviewed Maven tooling and test transport
        id: bootstrap
        working-directory: backend
        run: |
          chmod +x ./mvnw
          bash ./mvnw -B -ntp -f build-support/pom.xml install
      - name: Refresh public NVD database from the OWASP mirror
        id: nvd-warmup
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        working-directory: backend
        run: |
          # A failed feed download may leave a usable partial H2 database.
          # Retry in a new Maven process; never skip the public feed or
          # treat an incomplete update as a successful vulnerability audit.
          for attempt in 1 2; do
            echo "OWASP NVD mirror refresh attempt $attempt of 2"
            if timeout --signal=TERM --kill-after=30s 60m \
              bash ./mvnw -B -ntp -N \
              -DdataDirectory="$RUNNER_TEMP/otziv-dependency-check-data" \
              -DnvdDatafeedUrl='https://dependency-check.github.io/DependencyCheck_Builder/nvd_cache/nvdcve-{0}.json.gz' \
              -DautoUpdate=true -DfailOnError=true -DossIndexAnalyzerEnabled=false \
              org.owasp:dependency-check-maven:13.0.0:update-only; then
              test -s "$RUNNER_TEMP/otziv-dependency-check-data/odc.mv.db"
              exit 0
            else
              result=$?
              echo "OWASP NVD mirror refresh attempt $attempt failed (exit $result)" >&2
            fi
            if [ "$attempt" -lt 2 ]; then sleep 20; fi
          done
          exit 1
      - name: Check public NVD cache file
        id: nvd-db
        if: ${{ !cancelled() && (steps.nvd-warmup.outcome == 'success' || steps.nvd-warmup.outcome == 'failure') }}
        env:
          WARMUP_OUTCOME: ${{ steps.nvd-warmup.outcome }}
        run: |
          if [ -s "$RUNNER_TEMP/otziv-dependency-check-data/odc.mv.db" ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          elif [ "$WARMUP_OUTCOME" = success ]; then
            echo 'NVD refresh succeeded without a database file' >&2
            exit 1
          fi
      # Preserve partial public-feed progress even when the warmup fails.
      # A later run must still finish the refresh before any audit may pass.
      - name: Save public NVD data
        id: nvd-save
        if: ${{ !cancelled() && steps.nvd-db.outputs.present == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/otziv-dependency-check-data/odc.mv.db
          key: ${{ runner.os }}-dependency-check-13-public-v2-${{ github.run_id }}-${{ github.run_attempt }}
      - name: OWASP dependency-check (CVSS 7+ blocks)
        id: audit
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' && steps.nvd-warmup.outcome == 'success' && steps.nvd-db.outputs.present == 'true' }}
        run: |
          rm -f -- target/dependency-check-report.json target/dependency-check-report.html target/plugin-audit-scope.json
          bash ./mvnw -B -ntp -Psecurity-audit -DskipTests verify
        working-directory: backend
      - name: Audit every build-support module and its effective plugins
        id: bootstrap-audit
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' && steps.nvd-warmup.outcome == 'success' && steps.nvd-db.outputs.present == 'true' }}
        run: >-
          python3 backend/build-support/audit.py
          --maven "$GITHUB_WORKSPACE/backend/mvnw"
          --settings "$HOME/.m2/settings.xml"
          --suppression-file "$GITHUB_WORKSPACE/infrastructure/runtime-security/maven-false-positives.xml"
          --data-directory "$RUNNER_TEMP/otziv-dependency-check-data"
      - name: Select the standalone issuer's supported Java runtime
        id: issuer-java
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' && steps.nvd-warmup.outcome == 'success' && steps.nvd-db.outputs.present == 'true' }}
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          show-download-progress: true
      - name: Audit the standalone issuer including provided and plugin dependencies
        id: issuer-audit
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' && steps.nvd-warmup.outcome == 'success' && steps.nvd-db.outputs.present == 'true' && steps.issuer-java.outcome == 'success' }}
        run: >-
          python3 backend/build-support/audit.py
          --standalone-project keycloak
          --maven "$GITHUB_WORKSPACE/backend/mvnw"
          --settings "$HOME/.m2/settings.xml"
          --suppression-file "$GITHUB_WORKSPACE/infrastructure/runtime-security/maven-false-positives.xml"
          --data-directory "$RUNNER_TEMP/otziv-dependency-check-data"
      - name: Audit all effective Maven packages with free OSV
        id: osv-audit
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        run: python3 backend/build-support/osv_audit.py
      # NVD and OSV audits remain independently blocking despite findings in an
      # earlier audit. Missing NVD reports also fail the OSV inventory check.
      - name: Upload dependency-check reports
        if: always()
        uses: ./.github/actions/upload-report
        with:
          name: maven-dependency-check
          path: |
            backend/target/dependency-check-report.html
            backend/target/dependency-check-report.json
            backend/target/osv-audit.json
            backend/target/plugin-audit-scope.json
            backend/build-support/**/target/dependency-check-report.html
            backend/build-support/**/target/dependency-check-report.json
            backend/build-support/**/target/plugin-audit-scope.json
            backend/build-support/target/audit-policy-verification.json
            backend/build-support/target/audit-report-coverage.json
            backend/build-support/target/audit-effective-pom.xml
            infrastructure/keycloak/security-generation/target/dependency-check-report.html
            infrastructure/keycloak/security-generation/target/dependency-check-report.json
            infrastructure/keycloak/security-generation/target/plugin-audit-scope.json
            infrastructure/keycloak/security-generation/target/audit-policy-verification.json
            infrastructure/keycloak/security-generation/target/audit-report-coverage.json
            infrastructure/keycloak/security-generation/target/audit-effective-pom.xml
          if-no-files-found: ignore
          retention-days: 14

  dependency-gate:
    name: Dependency audit gate
    if: always()
    needs: [changes, npm-audit, maven-audit]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - env:
          AUDIT_NEEDED: ${{ needs.changes.outputs.audit }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          NPM_RESULT: ${{ needs.npm-audit.result }}
          MAVEN_RESULT: ${{ needs.maven-audit.result }}
        run: node infrastructure/scripts/security/dependency-changes.mjs gate
