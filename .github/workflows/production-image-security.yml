name: Production image security

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  deployments: read

concurrency:
  group: production-image-security
  cancel-in-progress: false

jobs:
  inventory:
    name: Inventory the verified deployed release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.inventory.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: inventory
        env:
          OTZIV_GITHUB_READ_TOKEN: ${{ github.token }}
        run: python3 -B infrastructure/scripts/prod/production_images.py inventory --output "$RUNNER_TEMP/production-images.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-image-inventory
          path: ${{ runner.temp }}/production-images.json
          if-no-files-found: error
          retention-days: 14
  scan:
    name: Deployed image (${{ matrix.id }})
    needs: inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: production-image-inventory
          path: ${{ runner.temp }}/inventory
      - name: Scan deployed bytes with fresh vulnerability databases
        env:
          OTZIV_GITHUB_READ_TOKEN: ${{ github.token }}
          IMAGE_ID: ${{ matrix.id }}
        run: >-
          python3 -B infrastructure/scripts/prod/production_images.py scan
          --inventory "$RUNNER_TEMP/inventory/production-images.json"
          --identity "$IMAGE_ID" --output "$RUNNER_TEMP/evidence"
      - name: Preserve findings, SBOM, identity and scanner diagnostics
        if: always()
        uses: ./.github/actions/upload-report
        with:
          name: production-security-${{ matrix.id }}
          path: |
            ${{ runner.temp }}/evidence/*.json
            ${{ runner.temp }}/evidence/*.log
          if-no-files-found: warn
          retention-days: 30
