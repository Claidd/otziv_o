  '''^\n?\t=>\tk8s\.io/api\tv0\.35\.0\th1:iBAU5LTyBI9vw3L5glmat1njFK34srdLmktWwLTprlY=\r?$''',
  '''^\n?\t=>\tk8s\.io/apiextensions\-apiserver\tv0\.35\.0\th1:3xHk2rTOdWXXJM\+RDQZJvdx0yEOgC0FgQ1PlJatA5T4=\r?$''',
