condition = "AND"
regexTarget = "secret"
paths = ['''^infrastructure/runtime\-security/proofs/c7\-published/grafana/anonymous/registry\-attestation\-0\-payload\-0\.json$''']
regexes = [
  '''^da39a3ee5e6b4b0d3255bfef95601890afd80709$''',
]

