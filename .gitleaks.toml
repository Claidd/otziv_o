title = "otziv gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "otziv-sensitive-env-assignment"
description = "Sensitive environment/config variable assignment"
path = '''(?i)(^|/)([^/]*\.env(\..*)?|.*\.(properties|ya?ml|toml|json|conf|ini|ps1|sh|bash|cmd|bat))$'''
regex = '''(?i)(?:^|[\s"'`])([A-Z0-9_]*(?:PASSWORD|PASS|SECRET|TOKEN|API_KEY|ACCESS_KEY|PRIVATE_KEY|CLIENT_SECRET|WEBHOOK_SECRET|TERMINAL_KEY)[A-Z0-9_]*)[ \t]*[:=][ \t]*['"]?([^\s'"$][^\s'"]{7,})'''
secretGroup = 2
entropy = 2.0
keywords = [
  "password",
  "secret",
  "token",
  "api_key",
  "access_key",
  "private_key",
  "client_secret",
  "webhook_secret",
  "terminal_key",
]

[[rules.allowlists]]
paths = [
  '''(^|/)\.env(\..*)?\.example$''',
  '''(^|/)backend/\.env\.local\.example$''',
]

[[rules]]
id = "otziv-hardcoded-secret-literal"
description = "Hardcoded sensitive string literal"
regex = '''(?i)(password|secret|api[_-]?key|access[_-]?key|private[_-]?key|client[_-]?secret|webhook[_-]?secret)[A-Za-z0-9_]*[ \t]*[:=][ \t]*["']([^"'${}\s]{12,})["']'''
secretGroup = 2
entropy = 2.5
keywords = [
  "password",
  "secret",
  "api_key",
  "access_key",
  "private_key",
  "client_secret",
  "webhook_secret",
]

[[rules.allowlists]]
paths = [
  '''(^|/)backend/src/test/''',
  '''(^|/)frontend/src/.*\.spec\.ts$''',
  '''(^|/)mobile/src/.*\.spec\.ts$''',
]

[[rules]]
id = "otziv-env-file-with-sensitive-values"
description = "Real env file with sensitive keys"
path = '''(^|/)\.env(\..*)?$'''
regex = '''(?i)^\s*[A-Z0-9_]*(PASSWORD|PASS|SECRET|TOKEN|KEY|ACCESS|PRIVATE|CLIENT|WEBHOOK|S3|OPENAI|YANDEX|TELEGRAM|WHATSAPP|MAX|TBANK|TINKOFF|KEYCLOAK|GRAFANA)[A-Z0-9_]*\s*=\s*(.+)$'''
secretGroup = 2
entropy = 0.0
keywords = [
  "password",
  "secret",
  "token",
  "key",
  "webhook",
  "openai",
  "yandex",
  "telegram",
  "whatsapp",
  "tbank",
  "keycloak",
]

[[rules.allowlists]]
paths = [
  '''(^|/)\.env(\..*)?\.example$''',
  '''(^|/)backend/\.env\.local\.example$''',
]

[[allowlists]]
description = "generated and local-only directories"
paths = [
  '''(^|/)\.git/''',
  '''(^|/)\.idea/''',
  '''(^|/)\.m2/''',
  '''(^|/)target/''',
  '''(^|/)backend/target/''',
  '''(^|/)frontend/node_modules/''',
  '''(^|/)frontend/\.angular/''',
  '''(^|/)frontend/dist/''',
  '''(^|/)mobile/node_modules/''',
  '''(^|/)mobile/\.angular/''',
  '''(^|/)mobile/android/\.gradle/''',
  '''(^|/)mobile/dist/''',
  '''(^|/)mobile/android/app/build/''',
  '''(^|/)mobile/android/app/src/main/assets/public/''',
  '''(^|/)mobile/ios/App/App/public/''',
  '''(^|/)whatsapp/node_modules/''',
  '''(^|/)data/''',
  '''(^|/)logs/''',
  '''(^|/)mobile/builds/''',
  '''(^|/)\.codex-tmp/''',
  '''(^|/)\.codex-remote-attachments/''',
  '''(^|/)generated-assets/''',
  '''(^|/)mobile/android/app/google-services\.json$''',
  # Local Android signing credentials are intentionally ignored and never
  # tracked. Staging/CI gates separately fail closed on this exact path and on
  # *.jks/*.keystore, while the dir scan avoids reading the local values.
  '''(^|/)mobile/android/keystore\.properties$''',
]
regexes = [
  '''keycloak-postgres:5432/keycloak''',
  '''5432/keycloak''',
]
# Exact public Go module sums independently verified against sum.golang.org.
# Only generic-api-key; both the evidence path and one complete reviewed line match.
# RE2 anchors cover the entire line target. The optional leading LF is the
# pinned Gitleaks location() representation, not an arbitrary content prefix.
# Optional CR is only the CRLF line terminator; no arbitrary text is permitted.
[[allowlists]]
description = "Reviewed public Go module checksums in Grafana build provenance"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''(^|/)infrastructure/runtime\-security/adjudications/grafana\-tempo/reviewed\-buildinfo\.txt$''']
regexes = [
  '''^\n?\tdep\tcloud\.google\.com/go/auth\tv0\.20\.0\th1:kXTssoVb4azsVDoUiF8KvxAqrsQcQtB53DcSgta74CA=\r?$''',
  '''^\n?\tdep\tcloud\.google\.com/go/auth/oauth2adapt\tv0\.2\.8\th1:keo8NaayQZ6wimpNSmW5OPc283g65QNIiLpZnkHRbnc=\r?$''',
  '''^\n?\tdep\tgithub\.com/aws/aws\-sdk\-go\-v2/credentials\tv1\.19\.24\th1:2hQqYCV9yqyePQ9o6dCrZc/zO8U3TwPr9mIKlZnPu/I=\r?$''',
  '''^\n?\tdep\tgithub\.com/aws/aws\-sdk\-go\-v2/service/resourcegroupstaggingapi\tv1\.26\.6\th1:PwbxovpcJvb25k019bkibvJfCpCmIANOFrXZIFPmRzk=\r?$''',
  '''^\n?\tdep\tgithub\.com/blevesearch/bleve_index_api\tv1\.3\.0\th1:DsMpWVjFNlBw9/6pyWf59XoqcAkhHj3H0UWiQsavb6E=\r?$''',
  '''^\n?\tdep\tgithub\.com/blevesearch/upsidedown_store_api\tv1\.0\.2\th1:U53Q6YoWEARVLd1OYNc9kvhBMGZzVrdmaozG2MfoB\+A=\r?$''',
  '''^\n?\tdep\tgithub\.com/getkin/kin\-openapi\tv0\.147\.0\th1:s\+Xsm9gUMPJbgCnABZ2to3zSQQ5A9dyj/zo62VVsldY=\r?$''',
  '''^\n?\tdep\tgithub\.com/gogo/googleapis\tv1\.4\.1\th1:1Yx4Myt7BxzvUr5ldGSbwYiZG6t9wGBZ\+8/fX3Wvtq0=\r?$''',
  '''^\n?\tdep\tgithub\.com/hashicorp/consul/api\tv1\.33\.4\th1:AJkZp6qzgAYcMIU0\+CjJ0Rb7\+byfh0dazFK/gzlOcJk=\r?$''',
  '''^\n?\tdep\tgithub\.com/moby/moby/api\tv1\.54\.2\th1:wiat9QAhnDQjA7wk1kh/TqHz2I1uUA7M7t9SAl/JNXg=\r?$''',
  '''^\n?\tdep\tgolang\.org/x/oauth2\tv0\.36\.0\th1:peZ/1z27fi9hUOFCAZaHyrpWG5lwe0RJEEEeH0ThlIs=\r?$''',
