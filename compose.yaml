networks:
  docker_observer_net:
    internal: true
  internal_net:

volumes:
  mysql_data:
    name: ${DEV_MYSQL_VOLUME:-otziv-dev_mysql_973_data}
  keycloak_pg_data:
  loki_data:
  tempo_data:
  alloy_data:
  frontend_node_modules:

services:
  docker-observer:
    build:
      context: ./infrastructure/docker-observer
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker_observer_net

  mysql:
    # A fresh development volume retains older engine data separately.
    image: ghcr.io/claidd/otziv-security@sha256:3a3caaab4e71b3bfdec9da21c17c00ed10ca237151919aeddac8e5ce4b8b7baa
    container_name: my-mysql
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --restrict-fk-on-non-standard-key=OFF
      - --gtid-mode=OFF
      - --enforce-gtid-consistency=OFF
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --event-scheduler=OFF
    volumes:
      - mysql_data:/var/lib/mysql
      - ./data/mysql_backup:/backup
      - ./data/bots:/var/lib/mysql-files/
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-local-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me-local-mysql}
    networks:
      internal_net:

  nginx:
    image: ghcr.io/claidd/otziv-security@sha256:025c28f7afbcc84d8d836840afb7cb2e8e44f2b4930131c4bbb539380fd8185f
    ports:
      - '127.0.0.1:80:80'
      - '127.0.0.1:443:443'
    restart: always
    volumes:
      - ./data/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./data/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./data/nginx/www:/var/www
      - ./data/nginx/logs/nginx:/var/log/nginx
#      - ./data/nginx/nginx.conf:/etc/nginx/nginx.conf
#      - ./data/nginx/o-ogo.crt:/etc/ssl/o-ogo.crt
#      - ./data/nginx/ca.crt:/etc/ssl/ca.crt
#      - ./data/nginx/o-ogo.key:/etc/ssl/o-ogo.key
    depends_on:
      - mysql
      - app
    networks:
      internal_net:

  app:
    stop_grace_period: 120s
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BUILD_NO_CACHE: 1
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - mysql
      - external-review-worker
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-local-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me-local-mysql}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN_LOCAL_DOCKER:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME_LOCAL_DOCKER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_USERNAME: ${MAIL_USERNAME}
      DATABASE_URL: ${DATABASE_URL}
      KEYCLOAK_ISSUER_URI: ${LOCAL_KEYCLOAK_ISSUER_URI:-http://localhost:8180/realms/otziv}
      KEYCLOAK_JWK_SET_URI: ${LOCAL_KEYCLOAK_JWK_SET_URI:-http://keycloak:8080/realms/otziv/protocol/openid-connect/certs}
      KEYCLOAK_ADMIN_SERVER_URL: ${LOCAL_KEYCLOAK_ADMIN_SERVER_URL:-http://keycloak:8080}
      KEYCLOAK_ADMIN_REALM: ${KEYCLOAK_ADMIN_REALM:-otziv}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-otziv-backend}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-change-me-local-secret}
      OTZIV_APP_BASE_URL: ${OTZIV_APP_BASE_URL:-http://localhost:4200}
      EXTERNAL_REVIEW_CHECK_ENABLED: ${EXTERNAL_REVIEW_CHECK_ENABLED:-false}
      EXTERNAL_REVIEW_CHECK_WORKER_BASE_URL: ${EXTERNAL_REVIEW_CHECK_WORKER_BASE_URL:-http://external-review-worker:3097}
      OTZIV_PAYMENTS_TBANK_ENABLED: ${OTZIV_PAYMENTS_TBANK_ENABLED:-false}
      OTZIV_PAYMENTS_TBANK_PAYMENT_LINKS_ENABLED: ${OTZIV_PAYMENTS_TBANK_PAYMENT_LINKS_ENABLED:-true}
      OTZIV_PAYMENTS_TBANK_MANAGER_UI_ENABLED: ${OTZIV_PAYMENTS_TBANK_MANAGER_UI_ENABLED:-false}
      OTZIV_PAYMENTS_TBANK_APPLY_CONFIRMED_PAYMENTS: ${OTZIV_PAYMENTS_TBANK_APPLY_CONFIRMED_PAYMENTS:-false}
      OTZIV_CONTRACTOR_PAYMENTS_LIVE_ROUTING_MASTER_ENABLED: ${OTZIV_CONTRACTOR_PAYMENTS_LIVE_ROUTING_MASTER_ENABLED:-false}
      OTZIV_CONTRACTOR_PAYMENTS_REWARD_ATTRIBUTION_MASTER_ENABLED: ${OTZIV_CONTRACTOR_PAYMENTS_REWARD_ATTRIBUTION_MASTER_ENABLED:-false}
      OTZIV_CONTRACTOR_PAYMENTS_ROUTING_LIMITS_MAX_SINGLE_INVOICE_KOPECKS: ${OTZIV_CONTRACTOR_PAYMENTS_ROUTING_LIMITS_MAX_SINGLE_INVOICE_KOPECKS:-5000000}
      OTZIV_CONTRACTOR_PAYMENTS_ROUTING_LIMITS_MAX_DAILY_PROFILE_AMOUNT_KOPECKS: ${OTZIV_CONTRACTOR_PAYMENTS_ROUTING_LIMITS_MAX_DAILY_PROFILE_AMOUNT_KOPECKS:-15000000}
      OTZIV_CONTRACTOR_PAYMENTS_ROUTING_LIMITS_MAX_DAILY_PROFILE_COUNT: ${OTZIV_CONTRACTOR_PAYMENTS_ROUTING_LIMITS_MAX_DAILY_PROFILE_COUNT:-50}
      OTZIV_PAYMENTS_TBANK_BASE_URL: ${OTZIV_PAYMENTS_TBANK_BASE_URL:-https://securepay.tinkoff.ru}
      OTZIV_PAYMENTS_TBANK_PRIMARY_NAME: ${OTZIV_PAYMENTS_TBANK_PRIMARY_NAME:-Основной магазин}
      OTZIV_PAYMENTS_TBANK_PRIMARY_TERMINAL_KEY: ${OTZIV_PAYMENTS_TBANK_PRIMARY_TERMINAL_KEY:-}
      OTZIV_PAYMENTS_TBANK_PRIMARY_PASSWORD: ${OTZIV_PAYMENTS_TBANK_PRIMARY_PASSWORD:-}
      OTZIV_PAYMENTS_TBANK_PRIMARY_TEST_TERMINAL_KEY: ${OTZIV_PAYMENTS_TBANK_PRIMARY_TEST_TERMINAL_KEY:-}
      OTZIV_PAYMENTS_TBANK_PRIMARY_TEST_PASSWORD: ${OTZIV_PAYMENTS_TBANK_PRIMARY_TEST_PASSWORD:-}
      OTZIV_PAYMENTS_TBANK_PRIMARY_LIVE_TERMINAL_KEY: ${OTZIV_PAYMENTS_TBANK_PRIMARY_LIVE_TERMINAL_KEY:-}
      OTZIV_PAYMENTS_TBANK_PRIMARY_LIVE_PASSWORD: ${OTZIV_PAYMENTS_TBANK_PRIMARY_LIVE_PASSWORD:-}
      OTZIV_PAYMENTS_TBANK_SECONDARY_TERMINAL_KEY: ${OTZIV_PAYMENTS_TBANK_SECONDARY_TERMINAL_KEY:-}
      OTZIV_PAYMENTS_TBANK_SECONDARY_PASSWORD: ${OTZIV_PAYMENTS_TBANK_SECONDARY_PASSWORD:-}
      OTZIV_PAYMENTS_TBANK_SECONDARY_TEST_TERMINAL_KEY: ${OTZIV_PAYMENTS_TBANK_SECONDARY_TEST_TERMINAL_KEY:-}
      OTZIV_PAYMENTS_TBANK_SECONDARY_TEST_PASSWORD: ${OTZIV_PAYMENTS_TBANK_SECONDARY_TEST_PASSWORD:-}
      OTZIV_PAYMENTS_TBANK_SECONDARY_LIVE_TERMINAL_KEY: ${OTZIV_PAYMENTS_TBANK_SECONDARY_LIVE_TERMINAL_KEY:-}
      OTZIV_PAYMENTS_TBANK_SECONDARY_LIVE_PASSWORD: ${OTZIV_PAYMENTS_TBANK_SECONDARY_LIVE_PASSWORD:-}
      OTZIV_PAYMENTS_TBANK_TERMINAL_KEY: ${OTZIV_PAYMENTS_TBANK_TERMINAL_KEY:-}
      OTZIV_PAYMENTS_TBANK_PASSWORD: ${OTZIV_PAYMENTS_TBANK_PASSWORD:-}
      OTZIV_PAYMENTS_TBANK_PUBLIC_BASE_URL: ${OTZIV_PAYMENTS_TBANK_PUBLIC_BASE_URL:-http://localhost:4200}
      OTZIV_PAYMENTS_TBANK_NOTIFICATION_PATH: ${OTZIV_PAYMENTS_TBANK_NOTIFICATION_PATH:-/api/payments/tbank/webhook}
      OTZIV_PAYMENTS_TBANK_SUCCESS_PATH: ${OTZIV_PAYMENTS_TBANK_SUCCESS_PATH:-/pay/success}
      OTZIV_PAYMENTS_TBANK_FAIL_PATH: ${OTZIV_PAYMENTS_TBANK_FAIL_PATH:-/pay/fail}
      OTZIV_PAYMENTS_TBANK_LINK_TTL: ${OTZIV_PAYMENTS_TBANK_LINK_TTL:-P90D}
      OTZIV_PAYMENTS_TBANK_REDIRECT_DUE: ${OTZIV_PAYMENTS_TBANK_REDIRECT_DUE:-P7D}
      OTZIV_PAYMENTS_TBANK_TAXATION: ${OTZIV_PAYMENTS_TBANK_TAXATION:-usn_income}
      OTZIV_PAYMENTS_TBANK_TAX: ${OTZIV_PAYMENTS_TBANK_TAX:-none}
      OTZIV_PAYMENTS_TBANK_PAYMENT_METHOD: ${OTZIV_PAYMENTS_TBANK_PAYMENT_METHOD:-full_payment}
      OTZIV_PAYMENTS_TBANK_PAYMENT_OBJECT: ${OTZIV_PAYMENTS_TBANK_PAYMENT_OBJECT:-service}
      OTZIV_PAYMENTS_TBANK_RECEIPT_ITEM_NAME: "${OTZIV_PAYMENTS_TBANK_RECEIPT_ITEM_NAME:-Репутационное сопровождение компании в сети Интернет}"
      OTZIV_PAYMENTS_TOCHKA_ENABLED: ${OTZIV_PAYMENTS_TOCHKA_ENABLED:-false}
      OTZIV_PAYMENTS_TOCHKA_TEST_MODE: ${OTZIV_PAYMENTS_TOCHKA_TEST_MODE:-true}
      OTZIV_PAYMENTS_TOCHKA_BASE_URL: ${OTZIV_PAYMENTS_TOCHKA_BASE_URL:-https://enter.tochka.com/uapi}
      OTZIV_PAYMENTS_TOCHKA_SANDBOX_BASE_URL: ${OTZIV_PAYMENTS_TOCHKA_SANDBOX_BASE_URL:-https://enter.tochka.com/sandbox/v2}
      OTZIV_PAYMENTS_TOCHKA_PROFILE_CODE: ${OTZIV_PAYMENTS_TOCHKA_PROFILE_CODE:-tochka-primary}
      OTZIV_PAYMENTS_TOCHKA_PROFILE_NAME: "${OTZIV_PAYMENTS_TOCHKA_PROFILE_NAME:-Точка Банк}"
      OTZIV_PAYMENTS_TOCHKA_CUSTOMER_CODE: ${OTZIV_PAYMENTS_TOCHKA_CUSTOMER_CODE:-}
      OTZIV_PAYMENTS_TOCHKA_MERCHANT_ID: ${OTZIV_PAYMENTS_TOCHKA_MERCHANT_ID:-}
      OTZIV_PAYMENTS_TOCHKA_CLIENT_ID: ${OTZIV_PAYMENTS_TOCHKA_CLIENT_ID:-}
      OTZIV_PAYMENTS_TOCHKA_REQUIRED_CASHBOX: ${OTZIV_PAYMENTS_TOCHKA_REQUIRED_CASHBOX:-}
      OTZIV_PAYMENTS_TOCHKA_JWT_TOKEN: ${OTZIV_PAYMENTS_TOCHKA_JWT_TOKEN:-}
      OTZIV_PAYMENTS_TOCHKA_TAX_SYSTEM_CODE: ${OTZIV_PAYMENTS_TOCHKA_TAX_SYSTEM_CODE:-}
      OTZIV_PAYMENTS_TOCHKA_VAT_TYPE: ${OTZIV_PAYMENTS_TOCHKA_VAT_TYPE:-none}
      OTZIV_PAYMENTS_TOCHKA_PAYMENT_METHOD: ${OTZIV_PAYMENTS_TOCHKA_PAYMENT_METHOD:-full_payment}
      OTZIV_PAYMENTS_TOCHKA_PAYMENT_OBJECT: ${OTZIV_PAYMENTS_TOCHKA_PAYMENT_OBJECT:-service}
      OTZIV_PAYMENTS_TOCHKA_MEASURE: "${OTZIV_PAYMENTS_TOCHKA_MEASURE:-шт.}"
      OTZIV_PAYMENTS_TOCHKA_RECEIPT_ITEM_NAME: "${OTZIV_PAYMENTS_TOCHKA_RECEIPT_ITEM_NAME:-Репутационное сопровождение компании в сети Интернет}"
      OTZIV_PAYMENTS_TOCHKA_PAYMENT_MODES: ${OTZIV_PAYMENTS_TOCHKA_PAYMENT_MODES:-card,sbp}
      OTZIV_PAYMENTS_TOCHKA_LINK_TTL: ${OTZIV_PAYMENTS_TOCHKA_LINK_TTL:-P7D}
      OTZIV_PAYMENTS_TOCHKA_CONNECT_TIMEOUT: ${OTZIV_PAYMENTS_TOCHKA_CONNECT_TIMEOUT:-PT5S}
      OTZIV_PAYMENTS_TOCHKA_READ_TIMEOUT: ${OTZIV_PAYMENTS_TOCHKA_READ_TIMEOUT:-PT30S}
      TZ: Asia/Irkutsk
      JAVA_OPTS: "-Xmx512m"
      OTZIV_SERVICE_NAME: ${OTZIV_SERVICE_NAME:-otziv-backend-local}
      OTZIV_TRACING_ENABLED: ${OTZIV_TRACING_ENABLED:-false}
      MANAGEMENT_TRACING_ENABLED: ${OTZIV_TRACING_ENABLED:-false}
      MANAGEMENT_TRACING_EXPORT_ENABLED: ${OTZIV_TRACING_ENABLED:-false}
      MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED: ${OTZIV_TRACING_ENABLED:-false}
      OTZIV_TRACING_SAMPLING_PROBABILITY: ${OTZIV_TRACING_SAMPLING_PROBABILITY:-0.1}
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: ${OTZIV_OTLP_TRACES_ENDPOINT:-http://tempo:4318/v1/traces}
      MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "false"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data/app-logs:/app/logs
    networks:
      internal_net:

  external-review-worker:
    stop_grace_period: 400s
    image: ${EXTERNAL_REVIEW_WORKER_IMAGE:-otziv-external-review-worker:local}
    build:
      context: ./backend/external-review-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${EXTERNAL_REVIEW_WORKER_PORT:-3097}:3097"
    environment:
      PORT: 3097
      TZ: ${TZ:-Asia/Irkutsk}
      CHECK_TIMEOUT_MS: ${EXTERNAL_REVIEW_CHECK_TIMEOUT_MS:-60000}
      MAX_REVIEW_SCROLLS: ${EXTERNAL_REVIEW_MAX_SCROLLS:-6}
      MATCH_CONFIRMED_THRESHOLD: ${EXTERNAL_REVIEW_MATCH_CONFIRMED_THRESHOLD:-0.92}
      MATCH_NEEDS_REVIEW_THRESHOLD: ${EXTERNAL_REVIEW_MATCH_NEEDS_REVIEW_THRESHOLD:-0.75}
      EXTERNAL_REVIEW_PROXY_ENABLED: ${EXTERNAL_REVIEW_PROXY_ENABLED:-false}
      EXTERNAL_REVIEW_PROXY_HOST: ${EXTERNAL_REVIEW_PROXY_HOST:-}
      EXTERNAL_REVIEW_PROXY_PORT: ${EXTERNAL_REVIEW_PROXY_PORT:-8888}
      EXTERNAL_REVIEW_PROXY_USERNAME: ${EXTERNAL_REVIEW_PROXY_USERNAME:-}
      EXTERNAL_REVIEW_PROXY_PASSWORD: ${EXTERNAL_REVIEW_PROXY_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3097/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      internal_net:

  frontend:
    image: ghcr.io/claidd/otziv-security@sha256:8917049917dc110930957c5d59cff66489d9a3e486ffdfe7b2221c40acc0f14c
    working_dir: /app
    command: sh -c "npm ci && npm run ng -- serve --host 0.0.0.0 --port 4200 --proxy-config proxy.docker.conf.json"
    ports:
      - "127.0.0.1:4200:4200"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - app
      - keycloak
    networks:
      internal_net:

  phpmyadmin:
    image: ghcr.io/claidd/otziv-security@sha256:0d805ad3b104f2a377b6e39f3e30e5707d8c6875a155a40d2c01e4ad608b5835
    profiles: ["db-admin"]
    ports:
      - "127.0.0.1:6571:80"
    volumes:
      - ./data/phpmyadmin/config.inc.php:/etc/phpmyadmin/config.inc.php
      - ./data/phpmyadmin/apache2.conf:/etc/apache2/conf-available/servername.conf
    environment:
      - UPLOAD_LIMIT=512M
      - PMA_HOST=mysql
      - PMA_USER=${MYSQL_USER}
      - PMA_PASSWORD=${MYSQL_PASSWORD}
    restart: always
    depends_on:
      - mysql
    command: /bin/sh -c "chmod 644 /etc/phpmyadmin/config.inc.php && apache2-foreground"
    networks:
      internal_net:

  log-viewer:
    image: amir20/dozzle@sha256:27128281cc1f93b0f849f2a5fb4ef9c12a0cce1135ab3b6fede27f9867c8a1c2
    profiles: ["observability"]
    container_name: log-viewer
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./data/app-logs:/logs
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - DOZZLE_LEVEL=info
    networks:
      - internal_net

  keycloak-postgres:
    image: ghcr.io/claidd/otziv-security@sha256:a30a580feb45fce65b87d21a104d407d3d1c5b255ae0e9a05ce9903e10adb270
    container_name: otziv-keycloak-postgres
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-change-me-local-keycloak}
      POSTGRES_DB: keycloak
    volumes:
      - keycloak_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U keycloak" ]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - internal_net

  keycloak:
    image: ghcr.io/claidd/otziv-security@sha256:bd5687843becb0cdb232c2b864cc3786fafb8fc91f30f531fa2db7fc4d1fc59d
    container_name: otziv-keycloak
    command: start-dev --import-realm
    ports:
      - "127.0.0.1:8180:8080"
      - "127.0.0.1:9000:9000"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-change-me-local-keycloak}
      KC_METRICS_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_RELATIVE_PATH: ${KC_HTTP_RELATIVE_PATH:-/}
      KC_SPI_THEME_CACHE_THEMES: "false"
      KC_SPI_THEME_CACHE_TEMPLATES: "false"
      KC_SPI_THEME_STATIC_MAX_AGE: "-1"
      OTZIV_APP_BASE_URL: ${OTZIV_APP_BASE_URL:-http://localhost:4200}
    volumes:
      - ./infrastructure/keycloak/realm-config.json:/opt/keycloak/data/import/realm-config.json:ro
      - ./infrastructure/keycloak/themes:/opt/keycloak/themes:ro
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    networks:
      - internal_net

  prometheus:
    image: ghcr.io/claidd/otziv-security@sha256:508c918889067ea070d3da34913a81bd6df8092fb18977ca339e2367e3d77692
    profiles: ["observability"]
    container_name: otziv-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/prometheus/delivery-rules.yml:/etc/prometheus/delivery-rules.yml:ro
    networks:
      - internal_net

  loki:
    image: ghcr.io/claidd/otziv-security@sha256:e1638cc4e592cfc301811518526fbdb7cf0573425ec519af76a6a806816215c9
    profiles: ["observability"]
    container_name: otziv-loki
    command: -config.file=/etc/loki/loki-config.yaml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./infrastructure/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    restart: unless-stopped
    networks:
      - internal_net
    healthcheck:
      test: ["CMD", "/usr/bin/http-ready", "http://127.0.0.1:3100/ready"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 40s

  tempo:
    image: ghcr.io/claidd/otziv-security@sha256:6e743b30d2eb3c59887e3f04ba56fd20a5e36f15d616c272d7a7ea30076cfa38
    stop_grace_period: 30s
    profiles: ["observability"]
    container_name: otziv-tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "127.0.0.1:3200:3200"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - ./infrastructure/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    restart: unless-stopped
    networks:
      - internal_net
    healthcheck:
      test: ["CMD", "/usr/bin/http-ready", "http://127.0.0.1:3200/ready"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 40s

  alloy:
    image: ghcr.io/claidd/otziv-security@sha256:d006cedf890ade4915a098a5362ce0cda9a3fd7ec2c02320f15e92ccfd669122
    profiles: ["observability"]
    container_name: otziv-alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      - ./infrastructure/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./data/app-logs:/var/log/otziv-app:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki
      - tempo
    restart: unless-stopped
    networks:
      - docker_observer_net
      - internal_net

  grafana:
    image: ghcr.io/claidd/otziv-security@sha256:a9a36b873c7f4d424937a95f6d6c4c1f12f9d5f7556e23a1c81d6b649b570488
    profiles: ["observability"]
    container_name: otziv-grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-local-grafana}
      GF_METRICS_ENABLED: "true"
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning
      - ./infrastructure/grafana/dashboards:/etc/grafana/dashboards
    networks:
      - internal_net
