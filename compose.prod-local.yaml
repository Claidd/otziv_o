      DEEPSEEK_ANTHROPIC_DEEP_SEARCH_PASSES: ${DEEPSEEK_ANTHROPIC_DEEP_SEARCH_PASSES:-4}
      DEEPSEEK_ANTHROPIC_FALLBACK_ENABLED: ${DEEPSEEK_ANTHROPIC_FALLBACK_ENABLED:-true}
      REPUTATION_AI_PROVIDER: ${REPUTATION_AI_PROVIDER:-deepseek}
      REPUTATION_AI_MAX_WEBSITE_PAGES: ${REPUTATION_AI_MAX_WEBSITE_PAGES:-36}
      REPUTATION_AI_MAX_WEBSITE_CHARS: ${REPUTATION_AI_MAX_WEBSITE_CHARS:-20000}
      REPUTATION_AI_WEBSITE_TIMEOUT: ${REPUTATION_AI_WEBSITE_TIMEOUT:-8s}
      REPUTATION_AI_USER_AGENT: ${REPUTATION_AI_USER_AGENT:-OtzivReputationAI/1.0}
      REPUTATION_SEARCH_PROVIDER: ${REPUTATION_SEARCH_PROVIDER:-local}
      REPUTATION_SEARCH_MAX_QUERIES: ${REPUTATION_SEARCH_MAX_QUERIES:-10}
      REPUTATION_SEARCH_RESULTS_PER_QUERY: ${REPUTATION_SEARCH_RESULTS_PER_QUERY:-10}
      REPUTATION_SEARCH_CRAWL_RESULT_LIMIT: ${REPUTATION_SEARCH_CRAWL_RESULT_LIMIT:-20}
      YANDEX_AI_API_KEY: ${YANDEX_AI_API_KEY:-${YANDEX_SEARCH_API_KEY:-}}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-${YANDEX_SEARCH_FOLDER_ID:-}}
      YANDEX_GPT_BASE_URL: ${YANDEX_GPT_BASE_URL:-https://llm.api.cloud.yandex.net/foundationModels/v1/completion}
      YANDEX_GPT_RESPONSES_BASE_URL: ${YANDEX_GPT_RESPONSES_BASE_URL:-https://ai.api.cloud.yandex.net/v1}
      YANDEX_GPT_API_MODE: ${YANDEX_GPT_API_MODE:-responses}
      YANDEX_GPT_MODEL: ${YANDEX_GPT_MODEL:-yandexgpt/rc}
      YANDEX_GPT_TIMEOUT: ${YANDEX_GPT_TIMEOUT:-10m}
      YANDEX_GPT_MAX_TOKENS: ${YANDEX_GPT_MAX_TOKENS:-24000}
      YANDEX_GPT_MAX_TOOL_CALLS: ${YANDEX_GPT_MAX_TOOL_CALLS:-24}
      YANDEX_GPT_SEARCH_CONTEXT_SIZE: ${YANDEX_GPT_SEARCH_CONTEXT_SIZE:-high}
      YANDEX_GPT_SEARCH_REGION: ${YANDEX_GPT_SEARCH_REGION:-}
      YANDEX_SEARCH_API_KEY: ${YANDEX_SEARCH_API_KEY:-}
      YANDEX_SEARCH_FOLDER_ID: ${YANDEX_SEARCH_FOLDER_ID:-}
      YANDEX_SEARCH_BASE_URL: ${YANDEX_SEARCH_BASE_URL:-https://searchapi.api.cloud.yandex.net}
      YANDEX_SEARCH_TIMEOUT: ${YANDEX_SEARCH_TIMEOUT:-12s}
      YANDEX_SEARCH_TYPE: ${YANDEX_SEARCH_TYPE:-SEARCH_TYPE_RU}
      YANDEX_SEARCH_FAMILY_MODE: ${YANDEX_SEARCH_FAMILY_MODE:-FAMILY_MODE_MODERATE}
      YANDEX_SEARCH_REGION: ${YANDEX_SEARCH_REGION:-}
      JWT_SECRET: ${JWT_SECRET}
      LEAD_TRANSFER_URL: ${LEAD_TRANSFER_URL}
      LEAD_SYNCHRONY_URL: ${LEAD_SYNCHRONY_URL}
      LEAD_UPDATE_URL: ${LEAD_UPDATE_URL}
      LEAD_VPS_URL: ${LEAD_VPS_URL}
      LEAD_SYNC_OUTBOUND_ENABLED: ${LEAD_SYNC_OUTBOUND_ENABLED:-false}
      LEAD_VPS_RETRY_BATCH_SIZE: ${LEAD_VPS_RETRY_BATCH_SIZE:-100}
      LEAD_VPS_RETRY_MAX_ATTEMPTS: ${LEAD_VPS_RETRY_MAX_ATTEMPTS:-20}
      LEAD_VPS_RETRY_PERIOD_MS: ${LEAD_VPS_RETRY_PERIOD_MS:-1800000}
      APP_NAGUL_COOLDOWN: ${APP_NAGUL_COOLDOWN:-60}
      OTZIV_WORKER_CELLULAR_ACCESS_MODE: ${OTZIV_WORKER_CELLULAR_ACCESS_MODE:-OFF}
      OTZIV_WORKER_CELLULAR_REQUIRE_MOBILE_DEVICE: ${OTZIV_WORKER_CELLULAR_REQUIRE_MOBILE_DEVICE:-true}
      OTZIV_WORKER_CELLULAR_ALLOWED_CIDRS: ${OTZIV_WORKER_CELLULAR_ALLOWED_CIDRS:-178.177.216.0/22,178.177.220.0/22,91.78.236.0/22,91.78.216.0/21,91.78.224.0/21,91.79.216.0/21,91.79.224.0/21,91.79.232.0/22,89.113.30.0/23}
      OTZIV_WORKER_CELLULAR_IP_INTELLIGENCE_ENABLED: ${OTZIV_WORKER_CELLULAR_IP_INTELLIGENCE_ENABLED:-false}
      OTZIV_WORKER_CELLULAR_IP_INTELLIGENCE_BASE_URL: ${OTZIV_WORKER_CELLULAR_IP_INTELLIGENCE_BASE_URL:-https://api.ipquery.io/}
      OTZIV_WORKER_CELLULAR_IP_INTELLIGENCE_TIMEOUT: ${OTZIV_WORKER_CELLULAR_IP_INTELLIGENCE_TIMEOUT:-PT3S}
      OTZIV_WORKER_CELLULAR_IP_INTELLIGENCE_CACHE_TTL: ${OTZIV_WORKER_CELLULAR_IP_INTELLIGENCE_CACHE_TTL:-PT24H}
      OTZIV_WORKER_CELLULAR_VIOLATION_STATISTICS_ENABLED: ${OTZIV_WORKER_CELLULAR_VIOLATION_STATISTICS_ENABLED:-true}
      OTZIV_WORKER_CELLULAR_VIOLATION_EPISODE_WINDOW: ${OTZIV_WORKER_CELLULAR_VIOLATION_EPISODE_WINDOW:-PT30M}
      OTZIV_WORKER_CELLULAR_VIOLATION_RETENTION_DAYS: ${OTZIV_WORKER_CELLULAR_VIOLATION_RETENTION_DAYS:-90}
      OTZIV_WORKER_CELLULAR_COUNT_UNKNOWN_NETWORK_VIOLATIONS: ${OTZIV_WORKER_CELLULAR_COUNT_UNKNOWN_NETWORK_VIOLATIONS:-true}
      OTZIV_WORKER_CELLULAR_VIOLATION_STATISTICS_VISIBLE_TO_MANAGERS: ${OTZIV_WORKER_CELLULAR_VIOLATION_STATISTICS_VISIBLE_TO_MANAGERS:-true}
      OTZIV_WORKER_CELLULAR_ENFORCED_REASONS: ${OTZIV_WORKER_CELLULAR_ENFORCED_REASONS:-NON_CELLULAR_NETWORK,VPN_PROXY_OR_DATACENTER}
      OTZIV_WORKER_CELLULAR_ENFORCE_NATIVE_VIRTUAL_DEVICE: ${OTZIV_WORKER_CELLULAR_ENFORCE_NATIVE_VIRTUAL_DEVICE:-true}
      MULTIBROWSER_BASE_URL: ${MULTIBROWSER_BASE_URL:-http://multi-browser:3000}
      BACKUP_ENABLED: ${BACKUP_ENABLED:-false}
      BACKUP_WORK_DIR: ${BACKUP_WORK_DIR:-/app/backup}
      BACKUP_MYSQL_HOST: ${BACKUP_MYSQL_HOST:-mysql}
      BACKUP_MYSQL_PORT: ${BACKUP_MYSQL_PORT:-3306}
      BACKUP_MYSQL_DUMP_BINARY: ${BACKUP_MYSQL_DUMP_BINARY:-mysqldump}
      BACKUP_PART_SIZE_MB: ${BACKUP_PART_SIZE_MB:-35}
      BACKUP_MAIL_TO: ${BACKUP_MAIL_TO}
      BACKUP_MAIL_FROM: ${BACKUP_MAIL_FROM}
      BACKUP_MAIL_SUBJECT: ${BACKUP_MAIL_SUBJECT:-Otziv local database backup}
      BACKUP_MAIL_BODY: ${BACKUP_MAIL_BODY:-Local database backup}
      OTZIV_MOBILE_UPDATE_STORAGE_DIRECTORY: ${OTZIV_MOBILE_UPDATE_STORAGE_DIRECTORY:-/app/mobile-releases}
    volumes:
      - ./data/app-logs:/app/logs
      - ./data/app-backup:/app/backup
      - ./data/mobile-releases:/app/mobile-releases
      - sent_hashes:/app/sent-hashes
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15m
    depends_on:
      mysql:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      external-review-worker:
        condition: service_healthy
    networks:
      - internal_net
      - external_review_net
      - messaging_net

  external-review-worker:
    image: ${EXTERNAL_REVIEW_WORKER_IMAGE:-otziv-external-review-worker:prod-local}
    build:
      context: ./backend/external-review-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: ${EXTERNAL_REVIEW_WORKER_PIDS_LIMIT:-256}
    mem_limit: ${EXTERNAL_REVIEW_WORKER_MEMORY_LIMIT:-1g}
    cpus: ${EXTERNAL_REVIEW_WORKER_CPU_LIMIT:-1.0}
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m,mode=1777
    ports:
      - "127.0.0.1:${EXTERNAL_REVIEW_WORKER_PORT:-3097}:3097"
    environment:
      PORT: 3097
      TZ: ${TZ:-Asia/Irkutsk}
      CHECK_TIMEOUT_MS: ${EXTERNAL_REVIEW_CHECK_TIMEOUT_MS:-60000}
      MAX_REVIEW_SCROLLS: ${EXTERNAL_REVIEW_MAX_SCROLLS:-6}
      MATCH_CONFIRMED_THRESHOLD: ${EXTERNAL_REVIEW_MATCH_CONFIRMED_THRESHOLD:-0.92}
      MATCH_NEEDS_REVIEW_THRESHOLD: ${EXTERNAL_REVIEW_MATCH_NEEDS_REVIEW_THRESHOLD:-0.75}
      EXTERNAL_REVIEW_WORKER_SHARED_SECRET: ${EXTERNAL_REVIEW_WORKER_SHARED_SECRET:-}
      EXTERNAL_REVIEW_WORKER_AUTH_REQUIRED: ${EXTERNAL_REVIEW_WORKER_AUTH_REQUIRED:-false}
      REQUEST_BODY_LIMIT: ${EXTERNAL_REVIEW_REQUEST_BODY_LIMIT:-256kb}
      MAX_EXPECTED_TEXT_CHARS: ${EXTERNAL_REVIEW_MAX_EXPECTED_TEXT_CHARS:-20000}
      MAX_MAIN_NAVIGATIONS: ${EXTERNAL_REVIEW_MAX_MAIN_NAVIGATIONS:-10}
      MAX_CONCURRENT_CHECKS: ${EXTERNAL_REVIEW_MAX_CONCURRENT_CHECKS:-1}
      MAX_CHECK_DURATION_MS: ${EXTERNAL_REVIEW_MAX_CHECK_DURATION_MS:-120000}
      OCR_TIMEOUT_MS: ${EXTERNAL_REVIEW_OCR_TIMEOUT_MS:-30000}
      EXTERNAL_REVIEW_PROXY_ENABLED: ${EXTERNAL_REVIEW_PROXY_ENABLED:-false}
      EXTERNAL_REVIEW_PROXY_HOST: ${EXTERNAL_REVIEW_PROXY_HOST:-}
      EXTERNAL_REVIEW_PROXY_PORT: ${EXTERNAL_REVIEW_PROXY_PORT:-8888}
      EXTERNAL_REVIEW_PROXY_USERNAME: ${EXTERNAL_REVIEW_PROXY_USERNAME:-}
      EXTERNAL_REVIEW_PROXY_PASSWORD: ${EXTERNAL_REVIEW_PROXY_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3097/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - external_review_net

  nginx:
    image: ${WEB_IMAGE:-otziv-web:prod-local}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./infrastructure/nginx/prod-local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/nginx/logs:/var/log/nginx
    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      app:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - internal_net

  dozzle:
    image: amir20/dozzle
    profiles: ["observability"]
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:8089:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      DOZZLE_LEVEL: info
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - internal_net

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    restart: unless-stopped
    logging: *default-logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      app:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - internal_net

  loki:
    image: grafana/loki:2.9.8
    profiles: ["observability"]
    restart: unless-stopped
    logging: *default-logging
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./infrastructure/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3100/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal_net

  tempo:
    image: grafana/tempo:2.6.1
    profiles: ["observability"]
    restart: unless-stopped
    logging: *default-logging
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./infrastructure/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3200/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal_net

  alloy:
    image: grafana/alloy:v1.16.0
    profiles: ["observability"]
    restart: unless-stopped
    logging: *default-logging
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./infrastructure/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./data/app-logs:/var/log/otziv-app:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    healthcheck:
      test: ["CMD-SHELL", "alloy validate /etc/alloy/config.alloy >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - internal_net

  grafana:
    image: grafana/grafana:10.3.1
    profiles: ["observability"]
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:${LOCAL_GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${OTZIV_APP_BASE_URL}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_METRICS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_COOKIE_SECURE: "false"
      GF_SECURITY_COOKIE_SAMESITE: "lax"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/etc/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 3m
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    networks:
      - internal_net
