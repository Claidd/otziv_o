name: otziv-prod-local

x-default-logging: &default-logging
  driver: local
  options:
    max-size: "20m"
    max-file: "5"

networks:
  internal_net:
    driver: bridge
  external_review_net:
    driver: bridge
  messaging_net:
    driver: bridge

volumes:
  mysql_data:
    name: ${LOCAL_MYSQL_VOLUME:-otziv-prod-local_mysql_data}
  keycloak_pg_data:
  loki_data:
  tempo_data:
  alloy_data:
  grafana_data:
  prometheus_data:
  minio_data:
  sent_hashes:

services:
  mysql:
    # Keep prod-like checks on the exact MySQL 9.0.0 image used in production.
    image: mysql@sha256:8b879a3959bc59adcb7281a41950d39cf8c9b3fb23b87b9b62318ce884a7c383
    restart: unless-stopped
    logging: *default-logging
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --restrict-fk-on-non-standard-key=OFF
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${TZ:-Asia/Irkutsk}
    ports:
      - "127.0.0.1:${LOCAL_MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./data/mysql_backup:/backup
      - ./data/bots:/var/lib/mysql-files
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=TCP -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} $${MYSQL_DATABASE} -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - internal_net

  phpmyadmin:
    image: phpmyadmin@sha256:b68f318c5fd85541795ed8eb4ced28ea6908a89910871783b3e479cc6c6d1e1b
    profiles: ["db-admin"]
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:${LOCAL_PHPMYADMIN_PORT:-6572}:80"
    environment:
      UPLOAD_LIMIT: 512M
      PMA_HOST: mysql
      PMA_ARBITRARY: "0"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - internal_net

  keycloak-postgres:
    image: postgres@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB}
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      TZ: ${TZ:-Asia/Irkutsk}
    volumes:
      - keycloak_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - internal_net

  keycloak:
    image: quay.io/keycloak/keycloak@sha256:4883630ef9db14031cde3e60700c9a9a8eaf1b5c24db1589d6a2d43de38ba2a9
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 1g
    command: start --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/${KEYCLOAK_DB}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /keycloak
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL}
      KC_HOSTNAME_STRICT: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_PROXY_TRUSTED_ADDRESSES: ${KC_PROXY_TRUSTED_ADDRESSES:-172.16.0.0/12,127.0.0.0/8}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_LOG_LEVEL: INFO
      OTZIV_APP_BASE_URL: ${OTZIV_APP_BASE_URL}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
    volumes:
      - ./infrastructure/keycloak/realm-config.prod.json:/opt/keycloak/data/import/otziv-realm.json:ro
      - ./infrastructure/keycloak/themes:/opt/keycloak/themes:ro
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9000;
          printf "GET /keycloak/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
          cat <&3 | grep -q UP'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - internal_net

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    logging: *default-logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-local-minio-secret}
    ports:
      - "127.0.0.1:9001:9000"
      - "127.0.0.1:9002:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - internal_net

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    logging: *default-logging
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"
        mc mb --ignore-existing "local/$$S3_BUCKET"
        mc anonymous set download "local/$$S3_BUCKET"
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-local}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-local-minio-secret}
      S3_BUCKET: ${S3_BUCKET:-local}
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - internal_net

  app:
    image: ${APP_IMAGE:-otziv-app:prod-local}
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    environment:
      SPRING_PROFILES_ACTIVE: prod
      WEBHOOK_RATE_LIMIT_ENABLED: ${WEBHOOK_RATE_LIMIT_ENABLED:-true}
      WEBHOOK_RATE_LIMIT_MAX_REQUESTS: ${WEBHOOK_RATE_LIMIT_MAX_REQUESTS:-120}
      WEBHOOK_RATE_LIMIT_WINDOW: ${WEBHOOK_RATE_LIMIT_WINDOW:-PT1M}
      WEBHOOK_RATE_LIMIT_MAX_BUCKETS: ${WEBHOOK_RATE_LIMIT_MAX_BUCKETS:-10000}
      WEBHOOK_RATE_LIMIT_TRUSTED_PROXIES: "${WEBHOOK_RATE_LIMIT_TRUSTED_PROXIES:-127.0.0.0/8,::1/128,172.16.0.0/12}"
      WEBHOOK_RATE_LIMIT_MAX_FORWARDED_ADDRESSES: ${WEBHOOK_RATE_LIMIT_MAX_FORWARDED_ADDRESSES:-16}
      WEBHOOK_RATE_LIMIT_MAX_FORWARDED_HEADER_LENGTH: ${WEBHOOK_RATE_LIMIT_MAX_FORWARDED_HEADER_LENGTH:-2048}
      OTZIV_APP_BASE_URL: ${OTZIV_APP_BASE_URL:-http://localhost:8088}
      OTZIV_AUTH_LEGACY_MIGRATION_ENABLED: ${OTZIV_AUTH_LEGACY_MIGRATION_ENABLED:-true}
      OTZIV_AUTH_LEGACY_MIGRATION_RATE_LIMIT_ENABLED: ${OTZIV_AUTH_LEGACY_MIGRATION_RATE_LIMIT_ENABLED:-true}
      OTZIV_AUTH_LEGACY_MIGRATION_RATE_LIMIT_MAX_ATTEMPTS: ${OTZIV_AUTH_LEGACY_MIGRATION_RATE_LIMIT_MAX_ATTEMPTS:-5}
      OTZIV_AUTH_LEGACY_MIGRATION_RATE_LIMIT_WINDOW: ${OTZIV_AUTH_LEGACY_MIGRATION_RATE_LIMIT_WINDOW:-PT15M}
      OTZIV_AUTH_LEGACY_MIGRATION_RATE_LIMIT_MAX_BUCKETS: ${OTZIV_AUTH_LEGACY_MIGRATION_RATE_LIMIT_MAX_BUCKETS:-10000}
      EXTERNAL_REVIEW_CHECK_ENABLED: ${EXTERNAL_REVIEW_CHECK_ENABLED:-false}
      EXTERNAL_REVIEW_CHECK_WORKER_BASE_URL: ${EXTERNAL_REVIEW_CHECK_WORKER_BASE_URL:-http://external-review-worker:3097}
      EXTERNAL_REVIEW_CHECK_WORKER_SHARED_SECRET: ${EXTERNAL_REVIEW_WORKER_SHARED_SECRET:-}
      EXTERNAL_REVIEW_CHECK_WORKER_READ_TIMEOUT: ${EXTERNAL_REVIEW_CHECK_WORKER_READ_TIMEOUT:-160s}
