      OTZIV_PAYMENTS_TBANK_PRIMARY_TERMINAL_KEY: ${OTZIV_PAYMENTS_TBANK_PRIMARY_TERMINAL_KEY:-}
      OTZIV_PAYMENTS_TBANK_PRIMARY_PASSWORD: ${OTZIV_PAYMENTS_TBANK_PRIMARY_PASSWORD:-}
