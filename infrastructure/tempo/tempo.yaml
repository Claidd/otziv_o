
server:
  http_listen_port: 3200

# Примем otlp. Стандартные порты gprc 4317, http 4318
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318


# Если трейс не дополняется 10 сек буфер закрывается и пишится на диск. Ускоряет видимость трейсов и снижает память
ingester:
  trace_idle_period: 10s

# Хранит скомпактированные блоки 48 часов
compactor:
  compaction:
    compacted_block_retention: 48h

# Хранилище трейсов
storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces

