upstream otziv_app {
    server app:8080;
}

upstream otziv_keycloak {
    server keycloak:8080;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

map $request_uri $otziv_request_path {
    default /;
    "~^(?<otziv_path_without_args>[^?]*)" $otziv_path_without_args;
}

log_format otziv_safe '$remote_addr - $remote_user [$time_local] '
                      '"$request_method $otziv_request_path $server_protocol" $status $body_bytes_sent '
                      '"-" "$http_user_agent"';

map $request_uri $otziv_access_loggable {
    default 1;
    ~*^/api/review-check 0;
    ~*^/api/review-capability 0;
    ~*^/api/payments/public 0;
    "~*^/legacy(?:/|%2f|;|%3b)review(?:/|%2f|;|%3b)" 0;
    "~*^/[0-9a-f]{8}(?:-|%2d)[0-9a-f]{4}(?:-|%2d)[0-9a-f]{4}(?:-|%2d)[0-9a-f]{4}(?:-|%2d)[0-9a-f]{12}(?:/|%2f|;|%3b|\?|$)" 0;
    ~*^/review 0;
    ~*^/pay 0;
}

map $uri $otziv_redirect_access_loggable {
    default 1;
    ~*^/api/review-check 0;
    ~*^/api/review-capability 0;
    ~*^/api/payments/public 0;
    "~*^/legacy(?:/|;)review(?:/|;)" 0;
    "~*^/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}(?:/|;|$)" 0;
    ~*^/review 0;
    ~*^/pay 0;
}

server {
    listen 80;
    server_name 127.0.0.1;
    access_log /var/log/nginx/access.log otziv_safe if=$otziv_redirect_access_loggable;

    return 308 http://localhost:8088$request_uri;
}

server {
    listen 80;
    server_name localhost;
    access_log /var/log/nginx/access.log otziv_safe if=$otziv_access_loggable;
    server_tokens off;
    charset utf-8;

    client_max_body_size 105m;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port 8088;

    location = /actuator/health {
        proxy_pass http://otziv_app;
    }

    location /actuator/ {
        return 404;
    }

    location /internal/outreach/v1/ {
        access_log off;
        client_max_body_size 64k;
        proxy_pass http://otziv_app;
        proxy_read_timeout 60s;
    }

    location /api/ {
        proxy_pass http://otziv_app;
        proxy_read_timeout 10m;
    }

    # Public JSON endpoints never carry file uploads. Keep their request bodies
    # bounded independently from the 105 MB multipart limit used elsewhere.
    location = /api/auth/register {
        client_max_body_size 64k;
        proxy_pass http://otziv_app;
        proxy_read_timeout 120s;
    }

    # UUID/payment paths are bearer capabilities. Keep raw tokens out of the
    # reverse-proxy access log while application metrics retain bounded usage.
    location /api/review-check {
        client_max_body_size 2m;
        access_log off;
        error_log /dev/null crit;
        proxy_pass http://otziv_app;
        proxy_read_timeout 10m;
    }

    location /api/review-capability {
        client_max_body_size 2m;
        access_log off;
        error_log /dev/null crit;
        proxy_pass http://otziv_app;
        proxy_read_timeout 10m;
    }

    location /api/payments/public {
        client_max_body_size 64k;
        access_log off;
        error_log /dev/null crit;
        add_header Cache-Control "no-store" always;
        add_header Pragma "no-cache" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        proxy_pass http://otziv_app;
        proxy_read_timeout 10m;
    }

    location /images/ {
        proxy_pass http://otziv_app;
        proxy_read_timeout 120s;
    }

    location = /webhook {
        proxy_pass http://otziv_app;
        proxy_read_timeout 60s;
    }

    location /webhook/ {
        proxy_pass http://otziv_app;
        proxy_read_timeout 60s;
    }

    location /ws/ {
        proxy_pass http://otziv_app;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 8088;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }

    location = /legacy {
        return 301 /legacy/;
    }

    location /legacy/ {
        rewrite ^/legacy(/.*)$ $1 break;
        proxy_pass http://otziv_app;
        proxy_read_timeout 120s;
    }

    location /legacy/review/editReviews {
        access_log off;
        error_log /dev/null crit;
        client_max_body_size 2m;
        rewrite ^/legacy(/.*)$ $1 break;
        proxy_pass http://otziv_app;
        proxy_read_timeout 120s;
    }

    location /legacy/review/editReviewses {
        access_log off;
        error_log /dev/null crit;
        client_max_body_size 2m;
        rewrite ^/legacy(/.*)$ $1 break;
        proxy_pass http://otziv_app;
        proxy_read_timeout 120s;
    }

    location = /keycloak {
        return 301 /keycloak/;
    }

    location /keycloak/ {
        proxy_pass http://otziv_keycloak/keycloak/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 8088;
        proxy_set_header X-Forwarded-Prefix /keycloak;
        proxy_read_timeout 120s;
    }

    location = /grafana {
        return 404;
    }

    location = /actuator/prometheus {
        deny all;
    }

    location /grafana/api/live/ {
        return 404;
    }

    location /grafana/ {
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~* ^/(?:assets/.+\.(?:js|css|woff2?|ttf|otf|png|jpe?g|gif|webp|avif|svg|ico|webmanifest)|[^/]+\.(?:js|css|woff2?|ttf|otf|png|jpe?g|gif|webp|avif|svg|ico|webmanifest))$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        access_log off;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /index.html {
        root /usr/share/nginx/html;
        expires -1;
    }

    location ~* "^/(?:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}(?:/|;|$)|review(?:/|;|$)|pay(?:/|;|$))" {
        access_log off;
        error_log /dev/null crit;
        root /usr/share/nginx/html;
        rewrite ^ /index.html break;
        expires -1;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-store" always;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
