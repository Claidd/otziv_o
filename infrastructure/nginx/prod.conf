resolver 127.0.0.11 valid=10s ipv6=off;

upstream otziv_app {
    zone otziv_app 64k;
    server app:8080 resolve;
}

upstream otziv_keycloak {
    zone otziv_keycloak 64k;
    server keycloak:8080 resolve;
}

upstream otziv_grafana {
    zone otziv_grafana 64k;
    server grafana:3000 resolve;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

# Per-client limits for anonymous entry points only. Staff may share one office
# NAT address and the mobile app refreshes tokens in the background, so every
# limit is deliberately generous: it stops floods and password spraying, not
# people. Static files, SPA pages and authenticated /api/ are never limited.
# Public review/payment capability APIs must stay frictionless for clients who
# repeatedly edit and approve reviews, possibly several behind one address.
map $request_method $otziv_post_client {
    default "";
    POST $binary_remote_addr;
}

limit_req_zone $binary_remote_addr zone=otziv_kc_token:10m rate=5r/s;
limit_req_zone $otziv_post_client zone=otziv_kc_login:10m rate=30r/m;
limit_req_zone $otziv_post_client zone=otziv_auth_post:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=otziv_public_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=otziv_webhook:10m rate=20r/s;
limit_req_status 429;
limit_req_log_level warn;

# Only the exact health probe is a public management endpoint. Tomcat strips
# ";parameters" and Spring normalises paths, so any URI with an actuator
# segment is refused before location matching can proxy it to the backend.
map $uri $otziv_actuator_probe {
    default 0;
    /actuator/health 0;
    "~*(?:^|[/;])actuator(?:[/;]|$)" 1;
}

# The SPA does not require inline JavaScript. Legacy admin log pages and the
# Keycloak theme still do, so keep that compatibility exception scoped by URI
# instead of weakening every public/payment/review page.
map $uri $otziv_csp_script_src {
    default "'self'";
    ~*^/logs(?:/|$) "'self' 'unsafe-inline'";
    ~*^/keycloak(?:/|$) "'self' 'unsafe-inline'";
}

map $request_uri $otziv_request_path {
    default /;
    "~^(?<otziv_path_without_args>[^?]*)" $otziv_path_without_args;
}

log_format otziv_safe '$remote_addr - $remote_user [$time_local] '
                      '"$request_method $otziv_request_path $server_protocol" $status $body_bytes_sent '
                      '"-" "$http_user_agent"';

map $request_uri $otziv_access_loggable {
    default 1;
    ~*^/api/review-check 0;
    ~*^/api/review-capability 0;
    ~*^/api/payments/public 0;
    "~*^/legacy(?:/|%2f|;|%3b)review(?:/|%2f|;|%3b)" 0;
    "~*^/[0-9a-f]{8}(?:-|%2d)[0-9a-f]{4}(?:-|%2d)[0-9a-f]{4}(?:-|%2d)[0-9a-f]{4}(?:-|%2d)[0-9a-f]{12}(?:/|%2f|;|%3b|\?|$)" 0;
    ~*^/review 0;
    ~*^/pay 0;
}

# Redirect servers do not internally rewrite requests, so normalized URI
# matching closes percent-encoding bypasses before a bearer URL is logged.
map $uri $otziv_redirect_access_loggable {
    default 1;
    ~*^/api/review-check 0;
    ~*^/api/review-capability 0;
    ~*^/api/payments/public 0;
    "~*^/legacy(?:/|;)review(?:/|;)" 0;
    "~*^/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}(?:/|;|$)" 0;
    ~*^/review 0;
    ~*^/pay 0;
}

server {
    listen 80;
    server_name o-ogo.ru www.o-ogo.ru;
    access_log /var/log/nginx/access.log otziv_safe if=$otziv_redirect_access_loggable;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://o-ogo.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.o-ogo.ru;
    access_log /var/log/nginx/access.log otziv_safe if=$otziv_redirect_access_loggable;
    server_tokens off;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    return 301 https://o-ogo.ru$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name o-ogo.ru;
    access_log /var/log/nginx/access.log otziv_safe if=$otziv_access_loggable;
    server_tokens off;
    charset utf-8;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    # Mozilla "intermediate": TLS 1.2 AEAD/ECDHE suites only (TLS 1.3 suites
    # are fixed by OpenSSL). Tickets are off so session keys are not long-lived;
    # the shared cache still resumes sessions. No OCSP stapling: Let's Encrypt
    # certificates no longer carry an OCSP responder URL.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # Compatibility ceiling for authenticated upload endpoints (photos, APKs,
    # imports). Public JSON/capability/payment routes below have smaller limits.
    client_max_body_size 105m;
    client_header_timeout 15s;
    client_body_timeout 60s;
    send_timeout 60s;
    reset_timedout_connection on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml image/svg+xml;

    # Angular reads ngCspNonce from the application host and propagates it to
    # component <style> elements created at runtime. The request id is unique
    # per HTML response and contains only nonce-safe characters.
    sub_filter '<app-root></app-root>' '<app-root ngCspNonce="$request_id"></app-root>';
    sub_filter_once on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data: blob: https:; font-src 'self' data: https:; style-src 'self' 'nonce-$request_id'; style-src-elem 'self' 'nonce-$request_id'; style-src-attr 'unsafe-inline'; script-src $otziv_csp_script_src; connect-src 'self' https: wss:" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data: blob: https:; font-src 'self' data: https:; style-src 'self'; style-src-attr 'none'; script-src 'self'; connect-src 'self' https: wss:" always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Public Nginx is the only trusted proxy. Replace a client-supplied value
    # instead of appending it, so access rules cannot be bypassed with a fake header.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-Scheme https;
    proxy_set_header X-Forwarded-Ssl on;
    # Nginx does not inherit these into a location that sets any
    # proxy_set_header itself; such locations must clear Forwarded and
    # X-Forwarded-Prefix again.

    if ($otziv_actuator_probe) {
        return 404;
    }

    location = /actuator/health {
        proxy_pass http://otziv_app;
    }

    location /actuator/ {
        return 404;
    }

    # Machine-to-machine outreach bridge. The backend enforces a dedicated
    # constant-time shared-token check on every request.
    location /internal/outreach/v1/ {
        access_log off;
        client_max_body_size 64k;
        proxy_pass http://otziv_app;
        proxy_read_timeout 60s;
    }

    location /api/ {
        proxy_pass http://otziv_app;
        proxy_read_timeout 10m;
    }

    # Public JSON registration endpoints never carry file uploads. Keep their
    # request bodies bounded independently from the 105 MB multipart limit used
    # elsewhere, and throttle anonymous account creation (POST only).
    location /api/auth/ {
        client_max_body_size 64k;
        limit_req zone=otziv_auth_post burst=20 nodelay;
        proxy_pass http://otziv_app;
        proxy_read_timeout 120s;
    }

    # UUID/payment paths are bearer capabilities. Application metrics retain
    # bounded usage telemetry; raw tokens must not enter the access log.
    # Anonymous clients use these pages without login; the limit only cuts floods.
    location /api/review-check {
        client_max_body_size 2m;
        access_log off;
        error_log /dev/null crit;
        limit_req zone=otziv_public_api burst=300 nodelay;
        proxy_pass http://otziv_app;
        proxy_read_timeout 10m;
    }

    location /api/review-capability {
        client_max_body_size 2m;
        access_log off;
        error_log /dev/null crit;
        limit_req zone=otziv_public_api burst=300 nodelay;
        proxy_pass http://otziv_app;
        proxy_read_timeout 10m;
    }

    location /api/payments/public {
        client_max_body_size 64k;
        access_log off;
        error_log /dev/null crit;
        limit_req zone=otziv_public_api burst=300 nodelay;
        add_header Cache-Control "no-store" always;
        add_header Pragma "no-cache" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        # Own add_header directives drop the server-level set; repeat it.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data: blob: https:; font-src 'self' data: https:; style-src 'self' 'nonce-$request_id'; style-src-elem 'self' 'nonce-$request_id'; style-src-attr 'unsafe-inline'; script-src $otziv_csp_script_src; connect-src 'self' https: wss:" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data: blob: https:; font-src 'self' data: https:; style-src 'self'; style-src-attr 'none'; script-src 'self'; connect-src 'self' https: wss:" always;
        proxy_pass http://otziv_app;
        proxy_read_timeout 10m;
    }

    location /images/ {
        proxy_pass http://otziv_app;
        proxy_read_timeout 120s;
    }

    # Webhooks carry small JSON events without embedded media: the backend caps
    # MAX at 256 KiB and other webhooks at 1 MiB; the WhatsApp gateways post to
    # app:8080 directly. Reject larger anonymous bodies before buffering them.
    location = /webhook {
        client_max_body_size 1m;
        limit_req zone=otziv_webhook burst=200 nodelay;
        proxy_pass http://otziv_app;
        proxy_read_timeout 60s;
    }

    location /webhook/ {
        client_max_body_size 1m;
        limit_req zone=otziv_webhook burst=200 nodelay;
        proxy_pass http://otziv_app;
        proxy_read_timeout 60s;
    }

    # Browser capability paths contain high-entropy tokens. Keep them out of
    # logs and relay both noVNC assets and WebSocket traffic over the otziv origin.
    location /browser-vnc/ {
        access_log off;
        error_log /dev/null crit;

        proxy_http_version 1.1;
        proxy_set_header Host ${OTZIV_MULTIBROWSER_PUBLIC_HOST};
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto https;

        proxy_ssl_server_name on;
        proxy_ssl_name ${OTZIV_MULTIBROWSER_PUBLIC_HOST};
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;

        proxy_buffering off;
        proxy_read_timeout 1h;
        rewrite ^/browser-vnc/(.*)$ /$1 break;
        proxy_pass ${OTZIV_MULTIBROWSER_PUBLIC_UPSTREAM};
    }

    location /ws/ {
        proxy_pass http://otziv_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Scheme https;
        proxy_set_header X-Forwarded-Ssl on;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }

    # Legacy MVC is disabled in production (otziv.legacy.enabled=false) and no
    # web/mobile client links here. The old prefix-stripping proxy exposed every
    # backend path, /actuator/prometheus included, without the per-location
    # limits above, so the whole tree is closed. Old review links already got
    # 401/403 from the backend; the access-log maps still hide their tokens.
    location = /legacy {
        return 404;
    }

    location ^~ /legacy/ {
        return 404;
    }

    location = /keycloak {
        return 301 /keycloak/;
    }

    location /keycloak/ {
        proxy_pass http://otziv_keycloak/keycloak/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Nginx is the only public proxy; never preserve a client-supplied chain.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Scheme https;
        proxy_set_header X-Forwarded-Ssl on;
        proxy_set_header X-Forwarded-Prefix /keycloak;
        proxy_set_header Forwarded "";
        proxy_read_timeout 120s;

        # The admin console, admin REST API and master realm are not public.
        # The owner reaches them through an SSH tunnel to Keycloak's loopback
        # port (see docker-compose.yaml); the backend and the settings script
        # call keycloak:8080 directly and never pass through this proxy. Case
        # and ";matrix" variants are matched after nginx URI normalisation.
        location ~* "^/keycloak/(?:admin|realms/master)(?:[/;]|$)" {
            return 404;
        }

        # Code exchange, password and refresh grants of the public realm.
        location ~ "^/keycloak/realms/[^/]+/protocol/openid-connect/token(?:[/;]|$)" {
            limit_req zone=otziv_kc_token burst=60 nodelay;
            proxy_pass http://otziv_keycloak;
        }

        # Login, reset-credentials and required-action form submissions
        # (POST only; the zone key is empty for GET page loads).
        location ~ ^/keycloak/realms/[^/]+/login-actions/ {
            limit_req zone=otziv_kc_login burst=30 nodelay;
            proxy_pass http://otziv_keycloak;
        }
    }

    location = /grafana {
        return 301 /grafana/;
    }

    location = /actuator/prometheus {
        deny all;
    }

    location /grafana/api/live/ {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Scheme https;
        proxy_set_header X-Forwarded-Ssl on;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://otziv_grafana;
    }

    location /grafana/ {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass http://otziv_grafana;
        proxy_read_timeout 120s;
    }

    # Android domain verification must receive this exact JSON file, never the SPA fallback.
    location = /.well-known/assetlinks.json {
        root /usr/share/nginx/html;
        try_files $uri =404;
        types { application/json json; }
        default_type application/json;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=300" always;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    # A replacement Android signer cannot update an installed copy. Keep this
    # standalone migration page and APK outside the SPA fallback and caches.
    location = /android-new {
        return 302 /android-new/;
    }

    location = /android-new/ {
        root /usr/share/nginx/html;
        try_files /android-new/index.html =404;
        default_type text/html;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header Pragma no-cache always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    }

    location = /android-new/index.html {
        return 302 /android-new/;
    }

    location = /android-new/release.json {
        root /usr/share/nginx/html;
        try_files $uri =404;
        types { application/json json; }
        default_type application/json;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header Pragma no-cache always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location = /android-new/otziv-v1.0.75.apk {
        # This existing bind mount survives web-image rollouts. Deploy the APK
        # to ./data/nginx/www/android-new/otziv-v1.0.75.apk on the VPS.
        root /var/www/certbot;
        try_files $uri =404;
        types { application/vnd.android.package-archive apk; }
        default_type application/octet-stream;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header Pragma no-cache always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Content-Disposition 'attachment; filename="otziv-v1.0.75.apk"';
    }

    location = /android-new/otziv-v1.0.76.apk {
        # Serve the verified new-signer APK from the existing persistent bind mount.
        root /var/www/certbot;
        try_files $uri =404;
        types { application/vnd.android.package-archive apk; }
        default_type application/octet-stream;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header Pragma no-cache always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Content-Disposition 'attachment; filename="otziv-v1.0.76.apk"';
    }

    location = /android-new/otziv-v1.0.77.apk {
        # Serve the verified new-signer APK from the existing persistent bind mount.
        root /var/www/certbot;
        try_files $uri =404;
        types { application/vnd.android.package-archive apk; }
        default_type application/octet-stream;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header Pragma no-cache always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Content-Disposition 'attachment; filename="otziv-v1.0.77.apk"';
    }

    location = /android-new/otziv-v1.0.78.apk {
        # Serve the verified new-signer APK from the existing persistent bind mount.
        root /var/www/certbot;
        try_files $uri =404;
        types { application/vnd.android.package-archive apk; }
        default_type application/octet-stream;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header Pragma no-cache always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Content-Disposition 'attachment; filename="otziv-v1.0.78.apk"';
    }

    location = /android-new/otziv-v1.0.79.apk {
        # Serve the verified new-signer APK from the existing persistent bind mount.
        root /var/www/certbot;
        try_files $uri =404;
        types { application/vnd.android.package-archive apk; }
        default_type application/octet-stream;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header Pragma no-cache always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Content-Disposition 'attachment; filename="otziv-v1.0.79.apk"';
    }

    location = /android-new/otziv-v1.0.81.apk {
        # Serve the verified new-signer APK from the existing persistent bind mount.
        root /var/www/certbot;
        try_files $uri =404;
        types { application/vnd.android.package-archive apk; }
        default_type application/octet-stream;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
