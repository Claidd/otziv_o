    # Angular emits content-hashed bundles (outputHashing=all); only those are
    # immutable. `expires` keeps the server-level security headers inherited.
    location ~ "^/(?:[A-Za-z0-9_-]+-[A-Z0-9]{8}\.(?:js|css)|media/[^/]+-[A-Z0-9]{8}\.[A-Za-z0-9]+)$" {
        root /usr/share/nginx/html;
        try_files $uri =404;
        access_log off;
        expires 1y;
    }

    # The Keycloak silent-SSO callback keeps its URL across releases.
    location = /silent-check-sso.html {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires -1;
    }

    location = /silent-check-sso.js {
