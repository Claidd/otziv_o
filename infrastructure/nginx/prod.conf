resolver 127.0.0.11 valid=10s ipv6=off;

upstream otziv_app {
    zone otziv_app 64k;
    server app:8080 resolve;
}

upstream otziv_keycloak {
    zone otziv_keycloak 64k;
    server keycloak:8080 resolve;
}

upstream otziv_grafana {
    zone otziv_grafana 64k;
    server grafana:3000 resolve;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

# The SPA does not require inline JavaScript. Legacy admin log pages and the
# Keycloak theme still do, so keep that compatibility exception scoped by URI
# instead of weakening every public/payment/review page.
map $uri $otziv_csp_script_src {
    default "'self'";
    ~*^/logs(?:/|$) "'self' 'unsafe-inline'";
    ~*^/keycloak(?:/|$) "'self' 'unsafe-inline'";
}

map $request_uri $otziv_request_path {
    default /;
    "~^(?<otziv_path_without_args>[^?]*)" $otziv_path_without_args;
}

log_format otziv_safe '$remote_addr - $remote_user [$time_local] '
                      '"$request_method $otziv_request_path $server_protocol" $status $body_bytes_sent '
                      '"-" "$http_user_agent"';

map $request_uri $otziv_access_loggable {
    default 1;
    ~*^/api/review-check 0;
    ~*^/api/review-capability 0;
    ~*^/api/payments/public 0;
    "~*^/legacy(?:/|%2f|;|%3b)review(?:/|%2f|;|%3b)" 0;
    "~*^/[0-9a-f]{8}(?:-|%2d)[0-9a-f]{4}(?:-|%2d)[0-9a-f]{4}(?:-|%2d)[0-9a-f]{4}(?:-|%2d)[0-9a-f]{12}(?:/|%2f|;|%3b|\?|$)" 0;
    ~*^/review 0;
    ~*^/pay 0;
}

# Redirect servers do not internally rewrite requests, so normalized URI
# matching closes percent-encoding bypasses before a bearer URL is logged.
map $uri $otziv_redirect_access_loggable {
    default 1;
    ~*^/api/review-check 0;
    ~*^/api/review-capability 0;
    ~*^/api/payments/public 0;
    "~*^/legacy(?:/|;)review(?:/|;)" 0;
    "~*^/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}(?:/|;|$)" 0;
    ~*^/review 0;
    ~*^/pay 0;
}

server {
    listen 80;
    server_name o-ogo.ru www.o-ogo.ru;
    access_log /var/log/nginx/access.log otziv_safe if=$otziv_redirect_access_loggable;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://o-ogo.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.o-ogo.ru;
    access_log /var/log/nginx/access.log otziv_safe if=$otziv_redirect_access_loggable;
    server_tokens off;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_prefer_server_ciphers off;

    return 301 https://o-ogo.ru$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name o-ogo.ru;
    access_log /var/log/nginx/access.log otziv_safe if=$otziv_access_loggable;
    server_tokens off;
    charset utf-8;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_prefer_server_ciphers off;

    # Compatibility ceiling for authenticated upload endpoints (photos, APKs,
    # imports). Public JSON/capability/payment routes below have smaller limits.
    client_max_body_size 105m;
    client_header_timeout 15s;
    client_body_timeout 60s;
    send_timeout 60s;
    reset_timedout_connection on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml image/svg+xml;

    # Angular reads ngCspNonce from the application host and propagates it to
    # component <style> elements created at runtime. The request id is unique
    # per HTML response and contains only nonce-safe characters.
    sub_filter '<app-root></app-root>' '<app-root ngCspNonce="$request_id"></app-root>';
    sub_filter_once on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data: blob: https:; font-src 'self' data: https:; style-src 'self' 'nonce-$request_id'; style-src-elem 'self' 'nonce-$request_id'; style-src-attr 'unsafe-inline'; script-src $otziv_csp_script_src; connect-src 'self' https: wss:" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data: blob: https:; font-src 'self' data: https:; style-src 'self'; style-src-attr 'none'; script-src 'self'; connect-src 'self' https: wss:" always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Public Nginx is the only trusted proxy. Replace a client-supplied value
    # instead of appending it, so access rules cannot be bypassed with a fake header.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-Scheme https;
    proxy_set_header X-Forwarded-Ssl on;

    location = /actuator/health {
        proxy_pass http://otziv_app;
    }

    location /actuator/ {
        return 404;
    }

    # Machine-to-machine outreach bridge. The backend enforces a dedicated
    # constant-time shared-token check on every request.
    location /internal/outreach/v1/ {
        access_log off;
        client_max_body_size 64k;
        proxy_pass http://otziv_app;
        proxy_read_timeout 60s;
    }

    location /api/ {
        proxy_pass http://otziv_app;
        proxy_read_timeout 10m;
    }

    # Public JSON endpoints never carry file uploads. Keep their request bodies
    # bounded independently from the 105 MB multipart limit used elsewhere.
    location = /api/auth/register {
        client_max_body_size 64k;
        proxy_pass http://otziv_app;
        proxy_read_timeout 120s;
    }

    # UUID/payment paths are bearer capabilities. Application metrics retain
    # bounded usage telemetry; raw tokens must not enter the access log.
    location /api/review-check {
        client_max_body_size 2m;
        access_log off;
        error_log /dev/null crit;
        proxy_pass http://otziv_app;
        proxy_read_timeout 10m;
    }

    location /api/review-capability {
        client_max_body_size 2m;
        access_log off;
        error_log /dev/null crit;
        proxy_pass http://otziv_app;
        proxy_read_timeout 10m;
    }

    location /api/payments/public {
        client_max_body_size 64k;
        access_log off;
        error_log /dev/null crit;
        add_header Cache-Control "no-store" always;
        add_header Pragma "no-cache" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        proxy_pass http://otziv_app;
        proxy_read_timeout 10m;
    }

    location /images/ {
        proxy_pass http://otziv_app;
        proxy_read_timeout 120s;
    }

    location = /webhook {
        proxy_pass http://otziv_app;
        proxy_read_timeout 60s;
    }

    location /webhook/ {
        proxy_pass http://otziv_app;
        proxy_read_timeout 60s;
    }

    # Browser capability paths contain high-entropy tokens. Keep them out of
    # logs and relay both noVNC assets and WebSocket traffic over the otziv origin.
    location /browser-vnc/ {
        access_log off;
        error_log /dev/null crit;

        proxy_http_version 1.1;
        proxy_set_header Host ${OTZIV_MULTIBROWSER_PUBLIC_HOST};
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto https;

        proxy_ssl_server_name on;
        proxy_ssl_name ${OTZIV_MULTIBROWSER_PUBLIC_HOST};
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;

        proxy_buffering off;
        proxy_read_timeout 1h;
        rewrite ^/browser-vnc/(.*)$ /$1 break;
        proxy_pass ${OTZIV_MULTIBROWSER_PUBLIC_UPSTREAM};
    }

    location /ws/ {
        proxy_pass http://otziv_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Scheme https;
        proxy_set_header X-Forwarded-Ssl on;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }

    location = /legacy {
        return 301 /legacy/;
    }

    location /legacy/ {
        rewrite ^/legacy(/.*)$ $1 break;
        proxy_pass http://otziv_app;
        proxy_read_timeout 120s;
    }

    location /legacy/review/editReviews {
        access_log off;
        error_log /dev/null crit;
        client_max_body_size 2m;
        rewrite ^/legacy(/.*)$ $1 break;
        proxy_pass http://otziv_app;
        proxy_read_timeout 120s;
    }

    location /legacy/review/editReviewses {
        access_log off;
        error_log /dev/null crit;
        client_max_body_size 2m;
        rewrite ^/legacy(/.*)$ $1 break;
        proxy_pass http://otziv_app;
        proxy_read_timeout 120s;
    }

    location = /keycloak {
        return 301 /keycloak/;
    }

    location /keycloak/ {
        proxy_pass http://otziv_keycloak/keycloak/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Nginx is the only public proxy; never preserve a client-supplied chain.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Scheme https;
        proxy_set_header X-Forwarded-Ssl on;
        proxy_set_header X-Forwarded-Prefix /keycloak;
        proxy_set_header Forwarded "";
        proxy_read_timeout 120s;
    }

    location = /grafana {
        return 301 /grafana/;
    }

    location = /actuator/prometheus {
        deny all;
    }

    location /grafana/api/live/ {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Scheme https;
        proxy_set_header X-Forwarded-Ssl on;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://otziv_grafana;
    }

    location /grafana/ {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass http://otziv_grafana;
        proxy_read_timeout 120s;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~* ^/(?:assets/.+\.(?:js|css|woff2?|ttf|otf|png|jpe?g|gif|webp|avif|svg|ico|webmanifest)|[^/]+\.(?:js|css|woff2?|ttf|otf|png|jpe?g|gif|webp|avif|svg|ico|webmanifest))$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        access_log off;
        expires 1y;
    }

    location = /index.html {
        root /usr/share/nginx/html;
        expires -1;
    }

    location ~* "^/(?:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}(?:/|;|$)|review(?:/|;|$)|pay(?:/|;|$))" {
        access_log off;
        error_log /dev/null crit;
        root /usr/share/nginx/html;
        rewrite ^ /index.html break;
        expires -1;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-store" always;
        # Nginx does not inherit server-level add_header directives when a
        # location defines its own headers. Repeat CSP here so the deliberately
        # public review/payment capability pages are protected as well.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data: blob: https:; font-src 'self' data: https:; style-src 'self' 'nonce-$request_id'; style-src-elem 'self' 'nonce-$request_id'; style-src-attr 'unsafe-inline'; script-src $otziv_csp_script_src; connect-src 'self' https: wss:" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data: blob: https:; font-src 'self' data: https:; style-src 'self'; style-src-attr 'none'; script-src 'self'; connect-src 'self' https: wss:" always;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
