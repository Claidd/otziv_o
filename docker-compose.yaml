    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15m
    depends_on:
      mysql:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - internal_net
      - external_review_net
      - messaging_net

  external-review-worker:
    profiles: ["external-review"]
    image: ${EXTERNAL_REVIEW_WORKER_IMAGE:?EXTERNAL_REVIEW_WORKER_IMAGE must be an explicit deployment tag or digest}
    build:
      context: ./backend/external-review-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: ${EXTERNAL_REVIEW_WORKER_PIDS_LIMIT:-256}
    mem_limit: ${EXTERNAL_REVIEW_WORKER_MEMORY_LIMIT:-1g}
    cpus: ${EXTERNAL_REVIEW_WORKER_CPU_LIMIT:-1.0}
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m,mode=1777
    environment:
      PORT: 3097
      TZ: ${TZ:-Asia/Irkutsk}
      CHECK_TIMEOUT_MS: ${EXTERNAL_REVIEW_CHECK_TIMEOUT_MS:-60000}
      MAX_REVIEW_SCROLLS: ${EXTERNAL_REVIEW_MAX_SCROLLS:-6}
      MATCH_CONFIRMED_THRESHOLD: ${EXTERNAL_REVIEW_MATCH_CONFIRMED_THRESHOLD:-0.92}
      MATCH_NEEDS_REVIEW_THRESHOLD: ${EXTERNAL_REVIEW_MATCH_NEEDS_REVIEW_THRESHOLD:-0.75}
      EXTERNAL_REVIEW_WORKER_SHARED_SECRET: ${EXTERNAL_REVIEW_WORKER_SHARED_SECRET:-}
      EXTERNAL_REVIEW_WORKER_AUTH_REQUIRED: ${EXTERNAL_REVIEW_WORKER_AUTH_REQUIRED:-true}
      REQUEST_BODY_LIMIT: ${EXTERNAL_REVIEW_REQUEST_BODY_LIMIT:-256kb}
      MAX_EXPECTED_TEXT_CHARS: ${EXTERNAL_REVIEW_MAX_EXPECTED_TEXT_CHARS:-20000}
      MAX_MAIN_NAVIGATIONS: ${EXTERNAL_REVIEW_MAX_MAIN_NAVIGATIONS:-10}
      MAX_CONCURRENT_CHECKS: ${EXTERNAL_REVIEW_MAX_CONCURRENT_CHECKS:-1}
      MAX_CHECK_DURATION_MS: ${EXTERNAL_REVIEW_MAX_CHECK_DURATION_MS:-120000}
      OCR_TIMEOUT_MS: ${EXTERNAL_REVIEW_OCR_TIMEOUT_MS:-30000}
      EXTERNAL_REVIEW_PROXY_ENABLED: ${EXTERNAL_REVIEW_PROXY_ENABLED:-false}
      EXTERNAL_REVIEW_PROXY_HOST: ${EXTERNAL_REVIEW_PROXY_HOST:-}
      EXTERNAL_REVIEW_PROXY_PORT: ${EXTERNAL_REVIEW_PROXY_PORT:-8888}
      EXTERNAL_REVIEW_PROXY_USERNAME: ${EXTERNAL_REVIEW_PROXY_USERNAME:-}
      EXTERNAL_REVIEW_PROXY_PASSWORD: ${EXTERNAL_REVIEW_PROXY_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3097/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - external_review_net

  whatsapp_lika:
    image: ${WHATSAPP_IMAGE:?WHATSAPP_IMAGE must be an explicit deployment tag}
    build:
      context: .
      dockerfile: Dockerfile.whatsapp
    container_name: whatsapp_lika
    restart: unless-stopped
    logging: *default-logging
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # These entries admit the namespace/chroot syscalls through Docker's
    # default seccomp policy. USER node + no-new-privileges keeps the gateway
    # process itself on an empty effective capability set.
    cap_add:
      - SYS_ADMIN
      - SYS_CHROOT
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m,mode=1777
    pids_limit: ${WHATSAPP_PIDS_LIMIT:-512}
    mem_limit: ${WHATSAPP_MEMORY_LIMIT:-1536m}
    cpus: ${WHATSAPP_CPU_LIMIT:-1.0}
    environment:
      CLIENT_ID: ${WHATSAPP_LIKA_CLIENT_ID:-whatsapp_lika}
      SERVER_URL: ${WHATSAPP_BACKEND_URL:-http://app:8080}
      AUTH_PATH: /auth
      WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET:-}
      WHATSAPP_GATEWAY_SHARED_SECRET: ${WHATSAPP_GATEWAY_SHARED_SECRET:-}
      WHATSAPP_GATEWAY_AUTH_REQUIRED: ${WHATSAPP_GATEWAY_AUTH_REQUIRED:-true}
      WHATSAPP_QR_LOG_ENABLED: ${WHATSAPP_QR_LOG_ENABLED:-false}
      WHATSAPP_HTTP_BODY_LIMIT: ${WHATSAPP_HTTP_BODY_LIMIT:-256kb}
      WHATSAPP_HTTP_MAX_CONCURRENCY: ${WHATSAPP_HTTP_MAX_CONCURRENCY:-16}
      WHATSAPP_MAX_MESSAGE_CHARS: ${WHATSAPP_MAX_MESSAGE_CHARS:-20000}
      WHATSAPP_PROXY_ENABLED: ${WHATSAPP_PROXY_ENABLED:-false}
      WHATSAPP_PROXY_HOST: ${WHATSAPP_PROXY_HOST:-}
      WHATSAPP_PROXY_PORT: ${WHATSAPP_PROXY_PORT:-8888}
      WHATSAPP_PROXY_TYPE: ${WHATSAPP_PROXY_TYPE:-http}
      WHATSAPP_GROUPS_TIMEOUT_MS: ${WHATSAPP_GROUPS_TIMEOUT_MS:-10000}
      WHATSAPP_GROUPS_RESPONSE_TIMEOUT_MS: ${WHATSAPP_GROUPS_RESPONSE_TIMEOUT_MS:-25000}
      WHATSAPP_GROUPS_CACHE_TTL_MS: ${WHATSAPP_GROUPS_CACHE_TTL_MS:-600000}
      WHATSAPP_GROUP_INVITE_TIMEOUT_MS: ${WHATSAPP_GROUP_INVITE_TIMEOUT_MS:-2000}
      WHATSAPP_GROUP_INVITE_CONCURRENCY: ${WHATSAPP_GROUP_INVITE_CONCURRENCY:-16}
      WHATSAPP_PUPPETEER_TIMEOUT_MS: ${WHATSAPP_PUPPETEER_TIMEOUT_MS:-300000}
      WHATSAPP_READY_AFTER_AUTH_TIMEOUT_MS: ${WHATSAPP_READY_AFTER_AUTH_TIMEOUT_MS:-300000}
      WHATSAPP_STARTUP_READY_TIMEOUT_MS: ${WHATSAPP_STARTUP_READY_TIMEOUT_MS:-600000}
      WHATSAPP_WEBHOOK_ATTEMPTS: ${WHATSAPP_WEBHOOK_ATTEMPTS:-3}
      WHATSAPP_WEBHOOK_TIMEOUT_MS: ${WHATSAPP_WEBHOOK_TIMEOUT_MS:-10000}
      WHATSAPP_WEBHOOK_RETRY_DELAY_MS: ${WHATSAPP_WEBHOOK_RETRY_DELAY_MS:-500}
      WHATSAPP_MESSAGE_DEDUP_TTL_MS: ${WHATSAPP_MESSAGE_DEDUP_TTL_MS:-86400000}
      WHATSAPP_OUTBOUND_MARK_TTL_MS: ${WHATSAPP_OUTBOUND_MARK_TTL_MS:-600000}
    volumes:
      - ./data/whatsapp_auth/whatsapp_lika:/auth
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/ready >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10m
    depends_on:
      app:
        condition: service_healthy
    networks:
      - messaging_net

