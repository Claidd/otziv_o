        condition: service_healthy
    networks:
      - messaging_net

  nginx:
    image: ${WEB_IMAGE:?WEB_IMAGE must be an immutable release tag or digest}
    container_name: frontend
    restart: unless-stopped
    logging: *default-logging
    pids_limit: ${NGINX_PIDS_LIMIT:-256}
    mem_limit: ${NGINX_MEMORY_LIMIT:-512m}
    cpus: ${NGINX_CPU_LIMIT:-1.0}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./data/nginx/certs:/etc/nginx/certs:ro
      - ./data/nginx/www:/var/www/certbot
      - ./data/nginx/logs:/var/log/nginx
    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      app:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      grafana:
        condition: service_healthy
    networks:
      - internal_net

  certbot:
    image: certbot/certbot@sha256:34ee91d2f43008eb78a007d22f23ed4b2eaa9a454cb27ca2c042b49527a695b4
    logging: *default-logging
    profiles:
      - certbot
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/nginx/certs:/etc/nginx/certs
      - ./data/nginx/www:/var/www/certbot
    networks:
      - internal_net

  dozzle:
    image: amir20/dozzle@sha256:1c1060cfb5402093c4e0f03f3534d7deaffeb0a6f6dd034e7c5f244603f35fb3
    container_name: log-viewer
    restart: unless-stopped
    logging: *default-logging
    pids_limit: ${DOZZLE_PIDS_LIMIT:-256}
    mem_limit: ${DOZZLE_MEMORY_LIMIT:-512m}
    cpus: ${DOZZLE_CPU_LIMIT:-1.0}
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      DOZZLE_LEVEL: info
    networks:
      - internal_net
    healthcheck:
      test: [ "CMD", "/dozzle", "healthcheck" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus@sha256:2659f4c2ebb718e7695cb9b25ffa7d6be64db013daba13e05c875451cf51b0d3
    container_name: prometheus
    restart: unless-stopped
    logging: *default-logging
    pids_limit: ${PROMETHEUS_PIDS_LIMIT:-512}
    mem_limit: ${PROMETHEUS_MEMORY_LIMIT:-2g}
    cpus: ${PROMETHEUS_CPU_LIMIT:-2.0}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      app:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - internal_net

  loki:
    image: grafana/loki@sha256:8b5bd7748d0e4da66cd741ac276e485517514af0bea32167e27c0e1a95bcf8aa
    container_name: loki
    restart: unless-stopped
    logging: *default-logging
    pids_limit: ${LOKI_PIDS_LIMIT:-512}
    mem_limit: ${LOKI_MEMORY_LIMIT:-2g}
    cpus: ${LOKI_CPU_LIMIT:-2.0}
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./infrastructure/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3100/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal_net

  tempo:
    image: grafana/tempo@sha256:ef4384fce6e8ad22b95b243d8fc165628cda655376fd50e7850536ad89d71d50
    container_name: tempo
    restart: unless-stopped
    logging: *default-logging
    pids_limit: ${TEMPO_PIDS_LIMIT:-512}
    mem_limit: ${TEMPO_MEMORY_LIMIT:-1g}
    cpus: ${TEMPO_CPU_LIMIT:-1.0}
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./infrastructure/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3200/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal_net

  alloy:
    image: grafana/alloy@sha256:6e00cf7c5a692ff5f24844529416ed017d76fce922f8199004e73d5eca46b6b8
    container_name: alloy
    restart: unless-stopped
    logging: *default-logging
    pids_limit: ${ALLOY_PIDS_LIMIT:-512}
    mem_limit: ${ALLOY_MEMORY_LIMIT:-1g}
    cpus: ${ALLOY_CPU_LIMIT:-1.0}
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./infrastructure/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./data/app-logs:/var/log/otziv-app:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    healthcheck:
      test: ["CMD-SHELL", "alloy validate /etc/alloy/config.alloy >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - internal_net

  grafana:
    image: grafana/grafana@sha256:7567a7c70a3c1d75aeeedc968d1304174a16651e55a60d1fb132a05e1e63a054
    restart: unless-stopped
    logging: *default-logging
    pids_limit: ${GRAFANA_PIDS_LIMIT:-512}
    mem_limit: ${GRAFANA_MEMORY_LIMIT:-1g}
    cpus: ${GRAFANA_CPU_LIMIT:-1.0}
    ports:
      - "127.0.0.1:${GRAFANA_LOCAL_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${OTZIV_APP_BASE_URL}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_METRICS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: "strict"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/etc/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 3m
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    networks:
      - internal_net
