name: otziv-prod

x-default-logging: &default-logging
  driver: local
  options:
    max-size: "20m"
    max-file: "5"

networks:
  internal_net:
    driver: bridge
  external_review_net:
    driver: bridge
  messaging_net:
    driver: bridge

volumes:
  mysql_data:
    external: true
    name: docker_mysql_data
  keycloak_pg_data:
  loki_data:
  tempo_data:
  alloy_data:
  grafana_data:
  prometheus_data:
  sent_hashes:

services:
  mysql:
    # Production-verified MySQL 9.0.0; pin the registry digest to prevent an
    # unattended major upgrade when somebody refreshes the former latest tag.
    image: mysql@sha256:8b879a3959bc59adcb7281a41950d39cf8c9b3fb23b87b9b62318ce884a7c383
    container_name: my-mysql
    restart: unless-stopped
    logging: *default-logging
    pids_limit: ${MYSQL_PIDS_LIMIT:-1024}
    mem_limit: ${MYSQL_MEMORY_LIMIT:-4g}
    cpus: ${MYSQL_CPU_LIMIT:-4.0}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --restrict-fk-on-non-standard-key=OFF
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${TZ:-Asia/Irkutsk}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./data/mysql_backup:/backup
      - ./data/bots:/var/lib/mysql-files
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=TCP -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} $${MYSQL_DATABASE} -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - internal_net

  phpmyadmin:
    image: phpmyadmin@sha256:b68f318c5fd85541795ed8eb4ced28ea6908a89910871783b3e479cc6c6d1e1b
    profiles: ["db-admin"]
    restart: unless-stopped
    logging: *default-logging
    pids_limit: ${PHPMYADMIN_PIDS_LIMIT:-256}
    mem_limit: ${PHPMYADMIN_MEMORY_LIMIT:-512m}
    cpus: ${PHPMYADMIN_CPU_LIMIT:-0.5}
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-6571}:80"
    environment:
      UPLOAD_LIMIT: 512M
      PMA_HOST: mysql
      PMA_ARBITRARY: "0"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - internal_net
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1/ || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  keycloak-postgres:
    image: postgres@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
    container_name: keycloak-postgres
    restart: unless-stopped
    logging: *default-logging
    pids_limit: ${KEYCLOAK_DB_PIDS_LIMIT:-512}
    mem_limit: ${KEYCLOAK_DB_MEMORY_LIMIT:-2g}
    cpus: ${KEYCLOAK_DB_CPU_LIMIT:-2.0}
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB}
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      TZ: ${TZ:-Asia/Irkutsk}
    volumes:
      - keycloak_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - internal_net

  keycloak:
    image: quay.io/keycloak/keycloak@sha256:4883630ef9db14031cde3e60700c9a9a8eaf1b5c24db1589d6a2d43de38ba2a9
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${KEYCLOAK_MEMORY_LIMIT:-2g}
    pids_limit: ${KEYCLOAK_PIDS_LIMIT:-512}
    cpus: ${KEYCLOAK_CPU_LIMIT:-2.0}
    command: start --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/${KEYCLOAK_DB}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /keycloak
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL}
      KC_HOSTNAME_ADMIN: ${KEYCLOAK_PUBLIC_URL}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HOSTNAME_STRICT: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_PROXY_TRUSTED_ADDRESSES: ${KC_PROXY_TRUSTED_ADDRESSES:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16,127.0.0.0/8}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_LOG_LEVEL: INFO
      OTZIV_APP_BASE_URL: ${OTZIV_APP_BASE_URL}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
    volumes:
      - ./infrastructure/keycloak/realm-config.prod.json:/opt/keycloak/data/import/otziv-realm.json:ro
      - ./infrastructure/keycloak/themes:/opt/keycloak/themes:ro
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9000;
          printf "GET /keycloak/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
          cat <&3 | grep -q UP'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - internal_net

  app:
    image: ${APP_IMAGE:?APP_IMAGE must be an immutable release tag or digest}
    restart: unless-stopped
    init: true
    read_only: true
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    pids_limit: ${APP_PIDS_LIMIT:-512}
    mem_limit: ${APP_MEMORY_LIMIT:-2304m}
    cpus: ${APP_CPU_LIMIT:-2.0}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      WEBHOOK_RATE_LIMIT_ENABLED: ${WEBHOOK_RATE_LIMIT_ENABLED:-true}
      WEBHOOK_RATE_LIMIT_MAX_REQUESTS: ${WEBHOOK_RATE_LIMIT_MAX_REQUESTS:-120}
      WEBHOOK_RATE_LIMIT_WINDOW: ${WEBHOOK_RATE_LIMIT_WINDOW:-PT1M}
      WEBHOOK_RATE_LIMIT_MAX_BUCKETS: ${WEBHOOK_RATE_LIMIT_MAX_BUCKETS:-10000}
      WEBHOOK_RATE_LIMIT_TRUSTED_PROXIES: "${WEBHOOK_RATE_LIMIT_TRUSTED_PROXIES:-127.0.0.0/8,::1/128,172.16.0.0/12}"
      WEBHOOK_RATE_LIMIT_MAX_FORWARDED_ADDRESSES: ${WEBHOOK_RATE_LIMIT_MAX_FORWARDED_ADDRESSES:-16}
      WEBHOOK_RATE_LIMIT_MAX_FORWARDED_HEADER_LENGTH: ${WEBHOOK_RATE_LIMIT_MAX_FORWARDED_HEADER_LENGTH:-2048}
      REGISTRATION_RATE_LIMIT_MAX_REQUESTS: ${REGISTRATION_RATE_LIMIT_MAX_REQUESTS:-10}
      REGISTRATION_RATE_LIMIT_WINDOW: ${REGISTRATION_RATE_LIMIT_WINDOW:-PT10M}
      PERFORMER_REGISTRATION_PENDING_TTL: ${PERFORMER_REGISTRATION_PENDING_TTL:-PT48H}
      PERFORMER_REGISTRATION_EXPIRY_SCAN_MS: ${PERFORMER_REGISTRATION_EXPIRY_SCAN_MS:-900000}
      LEAD_INTEGRATION_LEGACY_BEARER_ENABLED: ${LEAD_INTEGRATION_LEGACY_BEARER_ENABLED:-false}
      LEAD_INTEGRATION_LEGACY_BEARER_ACCEPT_UNTIL: ${LEAD_INTEGRATION_LEGACY_BEARER_ACCEPT_UNTIL:-2026-08-17T00:00:00Z}
      LEAD_DEVICE_TOKEN_COOKIE_SECURE: ${LEAD_DEVICE_TOKEN_COOKIE_SECURE:-true}
      LEAD_DEVICE_TOKEN_TTL_DAYS: ${LEAD_DEVICE_TOKEN_TTL_DAYS:-30}
      OTZIV_APP_BASE_URL: ${OTZIV_APP_BASE_URL:-https://o-ogo.ru}
      OTZIV_AUTH_LEGACY_MIGRATION_ENABLED: ${OTZIV_AUTH_LEGACY_MIGRATION_ENABLED:-false}
      OTZIV_AUTH_LEGACY_MIGRATION_RATE_LIMIT_ENABLED: ${OTZIV_AUTH_LEGACY_MIGRATION_RATE_LIMIT_ENABLED:-true}
      OTZIV_AUTH_LEGACY_MIGRATION_RATE_LIMIT_MAX_ATTEMPTS: ${OTZIV_AUTH_LEGACY_MIGRATION_RATE_LIMIT_MAX_ATTEMPTS:-5}
      OTZIV_AUTH_LEGACY_MIGRATION_RATE_LIMIT_WINDOW: ${OTZIV_AUTH_LEGACY_MIGRATION_RATE_LIMIT_WINDOW:-PT15M}
      OTZIV_AUTH_LEGACY_MIGRATION_RATE_LIMIT_MAX_BUCKETS: ${OTZIV_AUTH_LEGACY_MIGRATION_RATE_LIMIT_MAX_BUCKETS:-10000}
      OTZIV_SECURITY_LOCAL_STATE_EXEMPT_CLIENT_IDS: ${OTZIV_SECURITY_LOCAL_STATE_EXEMPT_CLIENT_IDS:-}
      OTZIV_CREDENTIAL_ENCRYPTION_REQUIRED: ${OTZIV_CREDENTIAL_ENCRYPTION_REQUIRED:-true}
      OTZIV_CREDENTIAL_ENCRYPTION_ACTIVE_KEY_ID: ${OTZIV_CREDENTIAL_ENCRYPTION_ACTIVE_KEY_ID:-primary}
      OTZIV_CREDENTIAL_ENCRYPTION_ACTIVE_KEY_BASE64: ${OTZIV_CREDENTIAL_ENCRYPTION_ACTIVE_KEY_BASE64:-}
      OTZIV_CREDENTIAL_ENCRYPTION_PREVIOUS_KEYS: ${OTZIV_CREDENTIAL_ENCRYPTION_PREVIOUS_KEYS:-}
      OTZIV_CREDENTIAL_ENCRYPTION_BACKFILL_ENABLED: ${OTZIV_CREDENTIAL_ENCRYPTION_BACKFILL_ENABLED:-true}
      OTZIV_CREDENTIAL_ENCRYPTION_BACKFILL_BATCH_SIZE: ${OTZIV_CREDENTIAL_ENCRYPTION_BACKFILL_BATCH_SIZE:-250}
      OTZIV_MONITORING_DISK_ENABLED: ${OTZIV_MONITORING_DISK_ENABLED:-true}
      OTZIV_MONITORING_DISK_WARNING_PERCENT: ${OTZIV_MONITORING_DISK_WARNING_PERCENT:-80}
      OTZIV_MONITORING_DISK_CRITICAL_PERCENT: ${OTZIV_MONITORING_DISK_CRITICAL_PERCENT:-90}
      OTZIV_MONITORING_DISK_EMERGENCY_PERCENT: ${OTZIV_MONITORING_DISK_EMERGENCY_PERCENT:-95}
      OTZIV_MONITORING_DISK_REPEAT_HOURS: ${OTZIV_MONITORING_DISK_REPEAT_HOURS:-6}
      EXTERNAL_REVIEW_CHECK_ENABLED: ${EXTERNAL_REVIEW_CHECK_ENABLED:-false}
      EXTERNAL_REVIEW_CHECK_WORKER_BASE_URL: ${EXTERNAL_REVIEW_CHECK_WORKER_BASE_URL:-http://external-review-worker:3097}
      EXTERNAL_REVIEW_CHECK_WORKER_SHARED_SECRET: ${EXTERNAL_REVIEW_WORKER_SHARED_SECRET:-}
      EXTERNAL_REVIEW_CHECK_WORKER_READ_TIMEOUT: ${EXTERNAL_REVIEW_CHECK_WORKER_READ_TIMEOUT:-160s}
      TZ: ${TZ:-Asia/Irkutsk}
      JAVA_OPTS: "${JAVA_OPTS:--Xms256m -Xmx768m -XX:MaxRAMPercentage=75} -Djdk.http.auth.tunneling.disabledSchemes= -Djdk.http.auth.proxying.disabledSchemes="
      APP_HTTP_CLIENT_CONNECT_TIMEOUT: ${APP_HTTP_CLIENT_CONNECT_TIMEOUT:-5s}
      APP_HTTP_CLIENT_READ_TIMEOUT: ${APP_HTTP_CLIENT_READ_TIMEOUT:-150s}
      OTZIV_SERVICE_NAME: ${OTZIV_SERVICE_NAME:-otziv-backend}
      OTZIV_TRACING_ENABLED: ${OTZIV_TRACING_ENABLED:-false}
      MANAGEMENT_TRACING_ENABLED: ${OTZIV_TRACING_ENABLED:-false}
      MANAGEMENT_TRACING_EXPORT_ENABLED: ${OTZIV_TRACING_ENABLED:-false}
      MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED: ${OTZIV_TRACING_ENABLED:-false}
      OTZIV_TRACING_SAMPLING_PROBABILITY: ${OTZIV_TRACING_SAMPLING_PROBABILITY:-0.1}
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: ${OTZIV_OTLP_TRACES_ENDPOINT:-http://tempo:4318/v1/traces}
      MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "false"
      DATABASE_URL: ${DATABASE_URL}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
      KEYCLOAK_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-otziv-backend}
      KEYCLOAK_ADMIN_SERVER_URL: ${KEYCLOAK_ADMIN_SERVER_URL}
      KEYCLOAK_ADMIN_REALM: ${KEYCLOAK_ADMIN_REALM:-otziv}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-otziv-backend}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-30m}
      OTZIV_LOG_PATH: ${OTZIV_LOG_PATH:-/app/logs}
      OTZIV_ROOT_LOG_LEVEL: ${OTZIV_ROOT_LOG_LEVEL:-INFO}
      OTZIV_APP_LOG_LEVEL: ${OTZIV_APP_LOG_LEVEL:-INFO}
      OTZIV_SPRING_LOG_LEVEL: ${OTZIV_SPRING_LOG_LEVEL:-WARN}
      OTZIV_CATALINA_LOG_LEVEL: ${OTZIV_CATALINA_LOG_LEVEL:-WARN}
