otziv.mobile.update.storage-directory=${OTZIV_MOBILE_UPDATE_STORAGE_DIRECTORY:./mobile-releases}

# Access to specialist review sections from mobile phones on carrier networks.
# Start with AUDIT, verify operator ranges in logs, then switch to ENFORCE.
otziv.worker.cellular-access.mode=${OTZIV_WORKER_CELLULAR_ACCESS_MODE:OFF}
otziv.worker.cellular-access.require-mobile-device=${OTZIV_WORKER_CELLULAR_REQUIRE_MOBILE_DEVICE:true}
otziv.worker.cellular-access.allowed-cidrs=${OTZIV_WORKER_CELLULAR_ALLOWED_CIDRS:178.177.216.0/22,178.177.220.0/22,91.78.236.0/22,91.78.216.0/21,91.78.224.0/21,91.79.216.0/21,91.79.224.0/21,91.79.232.0/22,89.113.30.0/23}
otziv.worker.cellular-access.ip-intelligence-enabled=${OTZIV_WORKER_CELLULAR_IP_INTELLIGENCE_ENABLED:false}
otziv.worker.cellular-access.ip-intelligence-base-url=${OTZIV_WORKER_CELLULAR_IP_INTELLIGENCE_BASE_URL:https://api.ipquery.io/}
otziv.worker.cellular-access.ip-intelligence-timeout=${OTZIV_WORKER_CELLULAR_IP_INTELLIGENCE_TIMEOUT:PT3S}
otziv.worker.cellular-access.ip-intelligence-cache-ttl=${OTZIV_WORKER_CELLULAR_IP_INTELLIGENCE_CACHE_TTL:PT24H}
otziv.worker.cellular-access.violation-statistics-enabled=${OTZIV_WORKER_CELLULAR_VIOLATION_STATISTICS_ENABLED:true}
otziv.worker.cellular-access.violation-episode-window=${OTZIV_WORKER_CELLULAR_VIOLATION_EPISODE_WINDOW:PT30M}
otziv.worker.cellular-access.violation-retention-days=${OTZIV_WORKER_CELLULAR_VIOLATION_RETENTION_DAYS:90}
otziv.worker.cellular-access.count-unknown-network-violations=${OTZIV_WORKER_CELLULAR_COUNT_UNKNOWN_NETWORK_VIOLATIONS:true}
otziv.worker.cellular-access.violation-statistics-visible-to-managers=${OTZIV_WORKER_CELLULAR_VIOLATION_STATISTICS_VISIBLE_TO_MANAGERS:true}
otziv.worker.cellular-access.enforced-reasons=${OTZIV_WORKER_CELLULAR_ENFORCED_REASONS:NON_CELLULAR_NETWORK,VPN_PROXY_OR_DATACENTER}
otziv.worker.cellular-access.enforce-native-virtual-device=${OTZIV_WORKER_CELLULAR_ENFORCE_NATIVE_VIRTUAL_DEVICE:true}

