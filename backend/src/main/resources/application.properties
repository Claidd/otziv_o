manager.summary.personal-delivery-cron=${MANAGER_SUMMARY_PERSONAL_DELIVERY_CRON:5 0 22 * * *}
manager.summary.finalize-cron=${MANAGER_SUMMARY_FINALIZE_CRON:0 0 0 * * *}
manager.summary.cleanup-cron=${MANAGER_SUMMARY_CLEANUP_CRON:0 45 3 * * *}
manager.summary.zone=${MANAGER_SUMMARY_ZONE:Asia/Irkutsk}
