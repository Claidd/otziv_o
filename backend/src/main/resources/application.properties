
otziv.mobile.push.firebase.enabled=${OTZIV_MOBILE_PUSH_FIREBASE_ENABLED:false}
otziv.mobile.push.firebase.app-name=${OTZIV_MOBILE_PUSH_FIREBASE_APP_NAME:otziv-mobile}
otziv.mobile.push.firebase.project-id=${OTZIV_MOBILE_PUSH_FIREBASE_PROJECT_ID:}
otziv.mobile.push.firebase.service-account-path=${OTZIV_MOBILE_PUSH_FIREBASE_SERVICE_ACCOUNT_PATH:}
otziv.mobile.push.firebase.service-account-json=${OTZIV_MOBILE_PUSH_FIREBASE_SERVICE_ACCOUNT_JSON:}
otziv.mobile.update.storage-directory=${OTZIV_MOBILE_UPDATE_STORAGE_DIRECTORY:./mobile-releases}

# Public legacy migration remains available by default, with an independent
# kill switch and a bounded per-client/per-account brute-force limiter. Trusted
# client IP resolution intentionally reuses WEBHOOK_RATE_LIMIT_TRUSTED_PROXIES.
otziv.auth.legacy-migration.enabled=${OTZIV_AUTH_LEGACY_MIGRATION_ENABLED:true}
otziv.auth.legacy-migration.rate-limit.enabled=${OTZIV_AUTH_LEGACY_MIGRATION_RATE_LIMIT_ENABLED:true}
otziv.auth.legacy-migration.rate-limit.max-attempts=${OTZIV_AUTH_LEGACY_MIGRATION_RATE_LIMIT_MAX_ATTEMPTS:5}
otziv.auth.legacy-migration.rate-limit.window=${OTZIV_AUTH_LEGACY_MIGRATION_RATE_LIMIT_WINDOW:PT15M}
otziv.auth.legacy-migration.rate-limit.max-buckets=${OTZIV_AUTH_LEGACY_MIGRATION_RATE_LIMIT_MAX_BUCKETS:10000}

# Access to specialist review sections from mobile phones on carrier networks.
# Start with AUDIT, verify operator ranges in logs, then switch to ENFORCE.
otziv.worker.cellular-access.mode=${OTZIV_WORKER_CELLULAR_ACCESS_MODE:OFF}
otziv.worker.cellular-access.require-mobile-device=${OTZIV_WORKER_CELLULAR_REQUIRE_MOBILE_DEVICE:true}
otziv.worker.cellular-access.allowed-cidrs=${OTZIV_WORKER_CELLULAR_ALLOWED_CIDRS:178.177.216.0/22,178.177.220.0/22,91.78.236.0/22,91.78.216.0/21,91.78.224.0/21,91.79.216.0/21,91.79.224.0/21,91.79.232.0/22,89.113.30.0/23}
otziv.worker.cellular-access.ip-intelligence-enabled=${OTZIV_WORKER_CELLULAR_IP_INTELLIGENCE_ENABLED:false}
otziv.worker.cellular-access.ip-intelligence-base-url=${OTZIV_WORKER_CELLULAR_IP_INTELLIGENCE_BASE_URL:https://api.ipquery.io/}
otziv.worker.cellular-access.ip-intelligence-timeout=${OTZIV_WORKER_CELLULAR_IP_INTELLIGENCE_TIMEOUT:PT3S}
otziv.worker.cellular-access.ip-intelligence-cache-ttl=${OTZIV_WORKER_CELLULAR_IP_INTELLIGENCE_CACHE_TTL:PT24H}
otziv.worker.cellular-access.violation-statistics-enabled=${OTZIV_WORKER_CELLULAR_VIOLATION_STATISTICS_ENABLED:true}
otziv.worker.cellular-access.violation-episode-window=${OTZIV_WORKER_CELLULAR_VIOLATION_EPISODE_WINDOW:PT30M}
otziv.worker.cellular-access.violation-retention-days=${OTZIV_WORKER_CELLULAR_VIOLATION_RETENTION_DAYS:90}
otziv.worker.cellular-access.count-unknown-network-violations=${OTZIV_WORKER_CELLULAR_COUNT_UNKNOWN_NETWORK_VIOLATIONS:true}
otziv.worker.cellular-access.violation-statistics-visible-to-managers=${OTZIV_WORKER_CELLULAR_VIOLATION_STATISTICS_VISIBLE_TO_MANAGERS:true}
otziv.worker.cellular-access.enforced-reasons=${OTZIV_WORKER_CELLULAR_ENFORCED_REASONS:NON_CELLULAR_NETWORK,VPN_PROXY_OR_DATACENTER}
otziv.worker.cellular-access.enforce-native-virtual-device=${OTZIV_WORKER_CELLULAR_ENFORCE_NATIVE_VIRTUAL_DEVICE:true}

# Manager daily summary: calculation is safe by default; delivery is enabled separately in app_settings.
manager.summary.snapshot-cron=${MANAGER_SUMMARY_SNAPSHOT_CRON:0 55 21 * * *}
manager.summary.delivery-cron=${MANAGER_SUMMARY_DELIVERY_CRON:0 0 22 * * *}
manager.summary.personal-delivery-cron=${MANAGER_SUMMARY_PERSONAL_DELIVERY_CRON:5 0 22 * * *}
manager.summary.finalize-cron=${MANAGER_SUMMARY_FINALIZE_CRON:0 0 0 * * *}
manager.summary.cleanup-cron=${MANAGER_SUMMARY_CLEANUP_CRON:0 45 3 * * *}
manager.summary.zone=${MANAGER_SUMMARY_ZONE:Asia/Irkutsk}

# Transactional outbox foundation. Enqueueing is transaction-bound, while the
# side-effect relay is deliberately disabled until typed handlers and their
# remote idempotency contracts have been validated in shadow rollout.
otziv.integration.outbox.relay-enabled=${OTZIV_INTEGRATION_OUTBOX_RELAY_ENABLED:false}
otziv.integration.outbox.batch-size=${OTZIV_INTEGRATION_OUTBOX_BATCH_SIZE:25}
otziv.integration.outbox.lease-duration=${OTZIV_INTEGRATION_OUTBOX_LEASE_DURATION:PT2M}
otziv.integration.outbox.default-max-attempts=${OTZIV_INTEGRATION_OUTBOX_DEFAULT_MAX_ATTEMPTS:20}
otziv.integration.outbox.base-backoff=${OTZIV_INTEGRATION_OUTBOX_BASE_BACKOFF:PT5S}
otziv.integration.outbox.max-backoff=${OTZIV_INTEGRATION_OUTBOX_MAX_BACKOFF:PT30M}
otziv.integration.outbox.jitter-ratio=${OTZIV_INTEGRATION_OUTBOX_JITTER_RATIO:0.20}
otziv.integration.outbox.max-payload-bytes=${OTZIV_INTEGRATION_OUTBOX_MAX_PAYLOAD_BYTES:65536}
otziv.integration.outbox.status-count-cap=${OTZIV_INTEGRATION_OUTBOX_STATUS_COUNT_CAP:10000}
otziv.integration.outbox.scheduler.fixed-delay-ms=${OTZIV_INTEGRATION_OUTBOX_FIXED_DELAY_MS:5000}
otziv.integration.outbox.scheduler.initial-delay-ms=${OTZIV_INTEGRATION_OUTBOX_INITIAL_DELAY_MS:30000}

# A database-backed fencing lease prevents multiple application replicas from
# retrying the same payment-success chat notification concurrently.
otziv.payments.success-notification-retry.lease-duration=${OTZIV_PAYMENT_SUCCESS_NOTIFICATION_RETRY_LEASE_DURATION:PT2M}
