<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'Браузер бота #' + ${botId}">Браузер бота</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: system-ui, sans-serif;
            background: #0b1220;
        }
        #topbar {
            height: 40px;
            background: #111827;
            color: #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            font-size: 14px;
            box-sizing: border-box;
        }

        /* ВАЖНО: скроллы здесь */
        #frame-wrap {
            height: calc(100% - 40px);
            overflow: auto;              /* <-- и вертикальный, и горизонтальный */
            background: #111;
        }

        /* iframe всегда в DOM и с размерами, но “невидимый” до onload */
        #browser-frame {
            display: block;              /* <-- НЕ display:none */
            width: 100%;
            height: 100%;
            border: none;
            visibility: hidden;          /* <-- вместо display:none */
        }

        #loading {
            position: absolute;
            left: 12px;
            top: 48px;
            padding: 8px 10px;
            background: rgba(17,24,39,0.85);
            color: #e5e7eb;
            border-radius: 8px;
            font-size: 13px;
            z-index: 10;
        }

        button {
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 6px 10px;
            cursor: pointer;
        }
        button:hover { background: #dc2626; }
        #vncPasswordWrap { margin-right: 10px; color: #cbd5e1; }
        #vncPassword { margin: 0 6px; color: #fde68a; font-weight: 800; letter-spacing: 0.08em; }
        #copyPasswordBtn { background: #2563eb; }
    </style>
</head>

<body>
<div id="topbar">
    <div>
        <span th:text="'Бот: ' + ${bot.fio}"></span>
    </div>
    <div>
        <span id="vncPasswordWrap" hidden>
            Пароль VNC: <code id="vncPassword"></code>
            <button id="copyPasswordBtn" type="button">Копировать</button>
        </span>
        <span id="status">Запуск браузера…</span>
        <button id="closeBtn">Закрыть сессию</button>
    </div>
</div>

<div id="loading">Открываю VNC…</div>

<div id="frame-wrap">
    <iframe id="browser-frame" scrolling="yes"></iframe>
</div>

<script th:inline="javascript">
    (() => {
        const botId = /*[[${botId}]]*/ 0;

        const statusEl = document.getElementById('status');
        const iframe   = document.getElementById('browser-frame');
        const closeBtn = document.getElementById('closeBtn');
        const vncPasswordWrap = document.getElementById('vncPasswordWrap');
        const vncPasswordEl = document.getElementById('vncPassword');
        const copyPasswordBtn = document.getElementById('copyPasswordBtn');
        const loading  = document.getElementById('loading');

        const controlCharacter = /[\u0000-\u001f\u007f-\u009f]/;
        const encodedControl = /%(?:0[0-9a-f]|1[0-9a-f]|7f)/i;
        const maxVncUrlLength = 4096;
        const loopbackHosts = new Set(['localhost', '127.0.0.1', '[::1]']);

        let closing = false;
        let sessionOpen = false;
        let sessionId = null;
        let heartbeatTimer = null;
        let heartbeatInFlight = false;

        function prepareVncUrl(rawUrl) {
            if (typeof rawUrl !== 'string'
                || rawUrl.length === 0
                || rawUrl.length > maxVncUrlLength
                || controlCharacter.test(rawUrl)
                || encodedControl.test(rawUrl)) {
                return null;
            }
            try {
                const url = new URL(rawUrl);
                const protocol = url.protocol.toLowerCase();
                if ((protocol !== 'http:' && protocol !== 'https:')
                    || !url.hostname
                    || url.username
                    || url.password) {
                    return null;
                }
                const pageUrl = new URL(window.location.origin);
                const targetLoopback = loopbackHosts.has(url.hostname.toLowerCase());
                const pageLoopback = loopbackHosts.has(pageUrl.hostname.toLowerCase());
                const localPair = targetLoopback && pageLoopback;
                if ((protocol === 'http:' && !targetLoopback)
                    || (url.origin !== pageUrl.origin && !localPair)) {
                    return null;
                }
                url.searchParams.set('autoconnect', '1');
                url.searchParams.set('reconnect', '1');
                url.searchParams.set('resize', 'none');
                url.searchParams.set('clip', 'true');
                return url.toString();
            } catch (error) {
                return null;
            }
        }

        function sessionUrl(action, id = sessionId) {
            if (id) {
                return `/api/bots/${botId}/browser/sessions/${encodeURIComponent(id)}/${action}`;
            }
            return `/api/bots/${botId}/browser/close`;
        }

        function stopHeartbeat() {
            if (heartbeatTimer !== null) {
                clearInterval(heartbeatTimer);
                heartbeatTimer = null;
            }
            heartbeatInFlight = false;
        }

        function clearVncPassword() {
            vncPasswordEl.textContent = '';
            vncPasswordWrap.hidden = true;
        }

        function startHeartbeat(intervalSeconds) {
            stopHeartbeat();
            const delay = Math.max(5, Number(intervalSeconds) || 20) * 1000;
            heartbeatTimer = setInterval(sendHeartbeat, delay);
        }

        async function sendHeartbeat() {
            const currentSessionId = sessionId;
            if (!currentSessionId || !sessionOpen || closing || heartbeatInFlight) return;
            heartbeatInFlight = true;
            try {
                const response = await fetch(sessionUrl('heartbeat', currentSessionId), {
                    method: 'POST'
                });
                if (response.status === 404 || response.status === 409) {
                    stopHeartbeat();
                    sessionOpen = false;
                    sessionId = null;
                    clearVncPassword();
                    iframe.onload = null;
                    iframe.removeAttribute('src');
                    iframe.style.visibility = 'hidden';
                    fetch(sessionUrl('close', currentSessionId), {
                        method: 'POST',
                        keepalive: true
                    }).catch(() => {});
                    statusEl.textContent = 'Доступ к браузерной сессии завершен';
                }
            } catch (error) {
                // A transient network failure is retried by the next interval;
                // the server-side lease still provides the final safety bound.
            } finally {
                heartbeatInFlight = false;
            }
        }

        async function openSession() {
            try {
                const resp = await fetch(`/api/bots/${botId}/browser/open`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ heartbeatSupported: true })
                });
                if (!resp.ok) {
                    statusEl.textContent = 'Ошибка запуска браузера';
                    return;
                }
                const data = await resp.json();
                sessionOpen = true;
                sessionId = typeof data.sessionId === 'string' && data.sessionId.trim()
                    ? data.sessionId.trim()
                    : null;

                const vncUrl = prepareVncUrl(data.vncUrl);
                const vncPassword = typeof data.vncPassword === 'string' && /^[A-Za-z0-9_-]{8,128}$/.test(data.vncPassword)
                    ? data.vncPassword : null;
                if (!vncUrl || !vncPassword) {
                    statusEl.textContent = 'Сервис браузера вернул небезопасный адрес';
                    closeSessionOnce('invalid-url');
                    return;
                }
                vncPasswordEl.textContent = vncPassword;
                vncPasswordWrap.hidden = false;
                if (sessionId) {
                    startHeartbeat(data.heartbeatIntervalSeconds);
                }

                iframe.onload = () => {
                    iframe.style.visibility = 'visible';
                    loading.style.display = 'none';
                    statusEl.textContent = 'Браузер запущен';
                };
                iframe.onerror = () => {
                    statusEl.textContent = 'Не удалось открыть браузер';
                };

                iframe.src = vncUrl;

            } catch (e) {
                statusEl.textContent = 'Ошибка подключения к сервису браузера';
            }
        }

        function closeSessionOnce(reason) {
            if (!sessionOpen || closing) return;
            closing = true;
            sessionOpen = false;
            const closingSessionId = sessionId;
            sessionId = null;
            stopHeartbeat();
            clearVncPassword();

            const url = sessionUrl('close', closingSessionId);

            if (reason === 'pagehide') {
                try {
                    if (navigator.sendBeacon(url)) return;
                } catch (error) {}
            }

            fetch(url, {
                method: 'POST',
                keepalive: true
            }).then(response => {
                if (reason === 'button') {
                    statusEl.textContent = response.ok
                        ? 'Сессия закрыта, вкладку можно закрыть'
                        : 'Сессия закрывается в фоновом режиме';
                }
            }).catch(() => {
                if (reason === 'button') {
                    statusEl.textContent = 'Сессия закрывается в фоновом режиме';
                }
            }).finally(() => {
                closing = false;
            });
        }

        copyPasswordBtn.addEventListener('click', async () => {
            const password = vncPasswordEl.textContent;
            if (!password || !navigator.clipboard) {
                statusEl.textContent = 'Не удалось скопировать пароль';
                return;
            }
            try {
                await navigator.clipboard.writeText(password);
                statusEl.textContent = 'Пароль VNC скопирован';
            } catch (error) {
                statusEl.textContent = 'Не удалось скопировать пароль';
            }
        });

        closeBtn.addEventListener('click', () => {
            closeBtn.disabled = true;
            statusEl.textContent = 'Отключение…';
            closeSessionOnce('button');
        });

        window.addEventListener('pagehide', () => closeSessionOnce('pagehide'), { once: true, capture: true });

        openSession();
    })();
</script>
</body>
</html>
