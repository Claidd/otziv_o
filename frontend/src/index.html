<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Компания О!</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Проверка отзывов от Компании О!">
  <meta name="theme-color" content="#111827">

  <meta property="og:type" content="website">
  <meta property="og:locale" content="ru_RU">
  <meta property="og:site_name" content="Компания О!">
  <meta property="og:title" content="Компания О!">
  <meta property="og:description" content="Проверка отзывов от Компании О!">
  <meta property="og:image" content="https://o-ogo.ru/assets/images/social-preview.png">
  <meta property="og:image:secure_url" content="https://o-ogo.ru/assets/images/social-preview.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Логотип Компании О!">
  <meta name="vk:image" content="https://o-ogo.ru/assets/images/social-preview.png">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Компания О!">
  <meta name="twitter:description" content="Проверка отзывов от Компании О!">
  <meta name="twitter:image" content="https://o-ogo.ru/assets/images/social-preview.png">
  <meta name="twitter:image:alt" content="Логотип Компании О!">
  <link rel="image_src" href="https://o-ogo.ru/assets/images/social-preview.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="favicon-48x48.png">
  <link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
</head>
<body>
  <section id="app-startup" role="status" aria-live="polite">
    <div class="app-startup__card">
      <p class="app-startup__brand">Компания О!</p>
      <div class="app-startup__loader" aria-hidden="true">
        <div class="app-startup__halo"></div>
        <svg class="app-startup__orbit" viewBox="0 0 128 128" fill="none">
          <circle class="app-startup__orbit-track" cx="64" cy="64" r="59" />
          <g class="app-startup__orbit-spin">
            <circle class="app-startup__orbit-arc" cx="64" cy="64" r="59" pathLength="100" />
            <circle cx="64" cy="5" r="4" fill="#ef451f" />
          </g>
        </svg>
        <svg class="app-startup__mark" viewBox="0 0 80 80" fill="none">
          <defs>
            <linearGradient id="app-startup-gradient" x1="16" y1="12" x2="64" y2="72" gradientUnits="userSpaceOnUse">
              <stop stop-color="#f51f2c" />
              <stop offset=".55" stop-color="#ef451f" />
              <stop offset="1" stop-color="#ffad18" />
            </linearGradient>
          </defs>
          <circle cx="40" cy="40" r="28" stroke="url(#app-startup-gradient)" stroke-width="8" />
        </svg>
        <svg class="app-startup__error-mark" viewBox="0 0 48 48" fill="none">
          <path d="M24 13v14" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
          <circle cx="24" cy="35" r="2" fill="currentColor" />
        </svg>
      </div>
      <h1 id="app-startup-title">Открываем страницу</h1>
      <p id="app-startup-message">Пожалуйста, подождите немного.<br>Всё необходимое уже загружается.</p>
      <div class="app-startup__progress" aria-hidden="true"><span></span></div>
      <button id="app-startup-retry" type="button" hidden>Обновить страницу</button>
      <noscript><p class="app-startup__noscript">Для открытия страницы включите JavaScript в настройках браузера.</p></noscript>
    </div>
  </section>
  <app-root></app-root>
</body>
</html>
