# Overlay for a browser service started from its repository with:
# docker compose -f compose.yaml -f compose.local-integration.yaml up -d
services:
  app:
    environment:
      MULTIBROWSER_BASE_URL: http://multibrowser-app:8081
      MULTIBROWSER_API_KEY: ${MULTIBROWSER_API_KEY:?MULTIBROWSER_API_KEY is required}
      MULTIBROWSER_CONNECTION_MODE: ${MULTIBROWSER_CONNECTION_MODE:-DIRECT}
      MULTIBROWSER_PROXY_URL: "${MULTIBROWSER_PROXY_URL:-}"
    networks:
      - multibrowser_net

networks:
  multibrowser_net:
    external: true
    name: ${MULTIBROWSER_NETWORK_NAME:-multi-browser-network}
